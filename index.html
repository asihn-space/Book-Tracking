      render();
    });
  });
  document.querySelectorAll('[data-action="pick-option"]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const key = el.getAttribute('data-dropdown');
      const value = el.getAttribute('data-value');
      if (key === 'filter') state.statusFilter = value;
      if (key === 'sort') state.sortBy = value;
      if (key === 'formStatus') {
        state.form.status = value;
        if (value !== 'done') state.form.endDate = '';
        else if (!state.form.endDate) state.form.endDate = todayStr();
      }
      state.openDropdown = null;
      render();
    });
  });

  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportData);
  const exportCsvBtn = document.getElementById('export-csv-btn');
  if (exportCsvBtn) exportCsvBtn.addEventListener('click', exportCSV);
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');
  if (importBtn && importFile) {
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); });
  }

  app.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    const id = el.getAttribute('data-id');
    if (action === 'toggle') {
      let pressTimer = null;
      let longPressed = false;
      const startPress = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          state.cardSelectMode = true;
          toggleCardSelection('book', id);
          render();
        }, 500);
      };
      const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
      el.addEventListener('pointerdown', startPress);
      el.addEventListener('pointerup', cancelPress);
      el.addEventListener('pointercancel', cancelPress);
      el.addEventListener('pointerleave', cancelPress);
      el.addEventListener('click', () => {
        if (longPressed) { longPressed = false; return; }
        if (state.cardSelectMode) {
          toggleCardSelection('book', id);
          render();
        } else {
          state.expandedId = id; state.confirmDeleteId = null; render();
        }
      });
    } else if (action === 'dash-card') {
      const ctype = el.getAttribute('data-ctype');
      let pressTimer = null;
      let longPressed = false;
      const startPress = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          state.cardSelectMode = true;
          toggleCardSelection(ctype, id);
          render();
        }, 500);
      };
      const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
      el.addEventListener('pointerdown', startPress);
      el.addEventListener('pointerup', cancelPress);
      el.addEventListener('pointercancel', cancelPress);
      el.addEventListener('pointerleave', cancelPress);
      el.addEventListener('click', () => {
        if (longPressed) { longPressed = false; return; }
        if (state.cardSelectMode) {
          toggleCardSelection(ctype, id);
          render();
        }
      });
    } else if (action === 'cancel-card-select') {
      el.addEventListener('click', () => { state.cardSelectMode = false; state.selectedCards = []; render(); });
    } else if (action === 'share-cards') {
      el.addEventListener('click', () => { shareSelectedCards(); });
    } else if (action === 'stop') {
      el.addEventListener('click', e => e.stopPropagation());
    } else if (action === 'close-detail') {
      el.addEventListener('click', e => { e.stopPropagation(); state.expandedId = null; state.confirmDeleteId = null; render(); });
    } else if (action === 'expand-quote') {
      const qIndex = parseInt(id, 10);
      let pressTimer = null;
      let longPressed = false;
      const startPress = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          state.quoteSelectMode = true;
          if (!state.selectedQuoteIndices.includes(qIndex)) state.selectedQuoteIndices = [...state.selectedQuoteIndices, qIndex];
          render();
        }, 500);
      };
      const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
      el.addEventListener('pointerdown', startPress);
      el.addEventListener('pointerup', cancelPress);
      el.addEventListener('pointercancel', cancelPress);
      el.addEventListener('pointerleave', cancelPress);
      el.addEventListener('click', () => {
        if (longPressed) { longPressed = false; return; }
        if (state.quoteSelectMode) {
          const idx = state.selectedQuoteIndices.indexOf(qIndex);
          if (idx !== -1) {
            state.selectedQuoteIndices = state.selectedQuoteIndices.filter(i => i !== qIndex);
          } else if (state.selectedQuoteIndices.length < 5) {
            state.selectedQuoteIndices = [...state.selectedQuoteIndices, qIndex];
          }
          render();
        } else {
          state.expandedQuoteIndex = qIndex;
          render();
        }
      });
    } else if (action === 'close-quote') {
      el.addEventListener('click', e => { e.stopPropagation(); state.expandedQuoteIndex = null; render(); });
    } else if (action === 'cancel-quote-select') {
      el.addEventListener('click', () => { state.quoteSelectMode = false; state.selectedQuoteIndices = []; render(); });
    } else if (action === 'share-quotes') {
      el.addEventListener('click', () => { shareQuoteCollage(); });
    } else if (action === 'edit') {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const book = state.books.find(b => b.id === id);
        if (book) { state.form = { ...emptyForm, ...book, status: book.status || getBookStatus(book), quotes: (book.quotes && book.quotes.length) ? [...book.quotes] : [''] }; state.editingId = id; state.expandedId = null; state.showForm = true; render(); }
      });
    } else if (action === 'ask-delete') {
      el.addEventListener('click', e => { e.stopPropagation(); state.confirmDeleteId = id; render(); });
    } else if (action === 'cancel-delete') {
      el.addEventListener('click', e => { e.stopPropagation(); state.confirmDeleteId = null; render(); });
    } else if (action === 'delete') {
      el.addEventListener('click', e => { e.stopPropagation(); state.books = state.books.filter(b => b.id !== id); saveBooks(); state.confirmDeleteId = null; state.expandedId = null; render(); });
    } else if (action === 'view-list') {
      el.addEventListener('click', () => { state.libraryView = 'list'; render(); });
    } else if (action === 'view-grid') {
      el.addEventListener('click', () => { state.libraryView = 'grid'; render(); });
    } else if (action === 'edit-name') {
      el.addEventListener('click', e => {
        e.stopPropagation();
        state.nameEditValue = state.userName === 'Reader' ? '' : state.userName;
        state.showNameEdit = true;
        render();
      });
    } else if (action === 'edit-preset') {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const i = Number(el.getAttribute('data-index'));
        state.editingPresetIndex = i;
        state.presetEditValue = ACCENT_PRESETS[i];
        state.presetEditError = '';
        render();
      });
    } else if (action === 'set-accent') {
      el.addEventListener('click', () => {
        const hex = el.getAttribute('data-hex');
        state.accentColor = hex;
        applyAccent(hex);
        STATUS_META.done.color = hex;
        saveAccentToStorage(hex);
        render();
      });
    } else if (action === 'pick-dashboard-cat') {
      el.addEventListener('click', () => {
        state.dashboardCategory = el.getAttribute('data-cat');
        render();
      });
    } else if (action === 'pick-year') {
      el.addEventListener('click', e => {
        e.stopPropagation();
        state.dashboardYearFilter = el.getAttribute('data-year') || '';
        state.showYearSheet = false;
        render();
      });
    } else if (action === 'pick-stat-field') {
      el.addEventListener('click', () => {
        state.statisticsField = el.getAttribute('data-field');
        state.showStatSheet = false;
        render();
      });
    } else if (action === 'open-year-sheet') {
      el.addEventListener('click', () => { state.showYearSheet = true; render(); });
    } else if (action === 'close-year-sheet') {
      el.addEventListener('click', e => { e.stopPropagation(); state.showYearSheet = false; render(); });
    } else if (action === 'open-stat-sheet') {
      el.addEventListener('click', () => { state.showStatSheet = true; render(); });
    } else if (action === 'close-stat-sheet') {
      el.addEventListener('click', e => { e.stopPropagation(); state.showStatSheet = false; render(); });
    } else if (action === 'add-quote') {
      el.addEventListener('click', () => {
        const current = (state.form.quotes && state.form.quotes.length) ? state.form.quotes : [''];
        state.form.quotes = [...current, ''];
        render();
      });
    } else if (action === 'remove-quote') {
      el.addEventListener('click', () => {
        const idx = Number(el.getAttribute('data-index'));
        const current = (state.form.quotes && state.form.quotes.length) ? state.form.quotes : [''];
        state.form.quotes = current.filter((_, i2) => i2 !== idx);
        render();
      });
    }
  });

  const form = document.getElementById('book-form');
  if (form) {
    const bind = (elId, key) => { const el = document.getElementById(elId); if (el) el.addEventListener('input', e => { state.form[key] = e.target.value; }); };
    bind('f-title', 'title'); bind('f-author', 'author'); bind('f-translator', 'translator');
    bind('f-publisher', 'publisher'); bind('f-language', 'language'); bind('f-country', 'country'); bind('f-origin-year', 'originYear'); bind('f-isbn', 'isbn');
    bind('f-start', 'startDate'); bind('f-end', 'endDate'); bind('f-review', 'review');
    bind('f-current-page', 'currentPage'); bind('f-total-pages', 'totalPages');

    document.querySelectorAll('.f-quote-input').forEach(el => {
      el.addEventListener('input', e => {
        const idx = Number(el.getAttribute('data-index'));
        if (!state.form.quotes || !state.form.quotes.length) state.form.quotes = [''];
        state.form.quotes[idx] = e.target.value;
      });
    });

    const coverUrlInput = document.getElementById('f-cover-url');
    if (coverUrlInput) coverUrlInput.addEventListener('input', e => { state.form.coverUrl = e.target.value; updateCoverPreview(); });

    const pickBtn = document.getElementById('pick-cover-btn');
    const coverFileInput = document.getElementById('f-cover-file');
    if (pickBtn && coverFileInput) {
      pickBtn.addEventListener('click', () => coverFileInput.click());
      coverFileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        resizeImageFile(file, 500, 0.78).then(dataUrl => {
          state.form.coverUrl = dataUrl;
          const urlInput = document.getElementById('f-cover-url');
          if (urlInput) urlInput.value = '';
          updateCoverPreview();
        }).catch(() => { alert('Failed to load image. Try another photo.'); });
      });
    }

    const ratingInput = document.getElementById('f-rating');
    if (ratingInput) ratingInput.addEventListener('input', e => {
      state.form.rating = Number(e.target.value);
      const label = document.getElementById('rating-label');
      if (label) label.textContent = `Rating — ${state.form.rating.toFixed(1)}/10`;
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!state.form.title.trim() || !state.form.author.trim()) return;
      if (state.form.status !== 'done') state.form.endDate = '';
      state.form.quotes = (state.form.quotes || []).map(q => (q || '').trim()).filter(Boolean);
      const wasDoneBefore = state.editingId ? getBookStatus(state.books.find(b => b.id === state.editingId)) === 'done' : false;
      const isDoneNow = state.form.status === 'done';
      let savedBook;
      if (state.editingId) {
        state.books = state.books.map(b => {
          if (b.id !== state.editingId) return b;
          savedBook = { ...state.form, id: state.editingId, addedAt: b.addedAt };
          return savedBook;
        });
      } else {
        savedBook = { ...state.form, id: uid(), addedAt: Date.now() };
        state.books = [savedBook, ...state.books];
      }
      saveBooks();
      state.showForm = false; state.editingId = null; state.form = { ...emptyForm, quotes: [''] };
      if (isDoneNow && !wasDoneBefore) {
        state.achievementBook = savedBook;
        state.showAchievement = true;
      }
      render();
    });

    const closeHandler = () => { state.showForm = false; state.editingId = null; state.form = { ...emptyForm, quotes: [''] }; render(); };
    const closeBtn = document.getElementById('close-form');
    const cancelBtn = document.getElementById('cancel-form');
    if (closeBtn) closeBtn.addEventListener('click', closeHandler);
    if (cancelBtn) cancelBtn.addEventListener('click', closeHandler);
  }
}

document.addEventListener('click', () => {
  if (state.openDropdown) {
    state.openDropdown = null;
    render();
  }
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist();
}
</script>
</body>
</html>
