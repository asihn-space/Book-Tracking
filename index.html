<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Tracking</title>
<link rel="manifest" href="mobile-manifest.json" />
<meta name="theme-color" content="#18181B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Outfit:wght@400;500;600;700;800&family=Sacramento&family=Alex+Brush&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --border: #E4E4E7;
    --text: #18181B;
    --text-soft: #71717A;
    --text-faint: #A1A1AA;
    --accent: #0CBAA6;
    --accent-rgb: 12, 186, 166;
    --accent-contrast: #FFFFFF;
    --accent-dark: #077367;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-script: 'Sacramento', cursive;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); }
  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
  .header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); padding: 20px 16px 14px; }
  .title { font-family: var(--font-display); font-size: 21px; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .header-name { font-family: var(--font-script); font-size: 26px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--accent); margin-left: 4px; vertical-align: middle; }
  .tabs { display: flex; gap: 4px; margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
  .tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 0; border-radius: 8px; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-soft); }
  .tab-btn.active { background: var(--accent); color: var(--accent-contrast); }
  .header-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .settings-btn { background: none; border: none; cursor: pointer; color: var(--text-soft); padding: 4px; margin-top: 1px; flex-shrink: 0; }
  .swatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .swatch-btn { width: 100%; aspect-ratio: 1; border-radius: 9999px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; outline-offset: 3px; }
  .swatch-btn.active { outline: 3px solid var(--text); }
  .swatch-wrap { position: relative; }
  .swatch-edit-btn { position: absolute; bottom: -3px; right: -3px; width: 20px; height: 20px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-soft); cursor: pointer; padding: 0; }
  .preset-edit-preview { width: 100%; height: 56px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
  .preset-edit-error { font-size: 12.5px; color: #B91C1C; margin: -8px 0 12px; }
  .swatch-hint { font-size: 12.5px; color: var(--text-soft); margin: 14px 0 0; }

  /* Dashboard modal */
  .dashboard-title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 800; font-size: 17px; margin: 0; }
  .dash-select-row { margin-bottom: 14px; }
  .dash-select-row .custom-select-wrap { width: 100%; }
  .dash-select-row .custom-select-trigger { padding: 10px 12px; font-size: 13.5px; font-weight: 600; }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .bar-rank-row { margin-bottom: 14px; }
  .bar-rank-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
  .bar-rank-name { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-rank-count { font-size: 12px; font-weight: 700; color: var(--text-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .bar-track { height: 10px; background: var(--bg); border-radius: 9999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 9999px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 9999px; background: var(--accent); color: var(--accent-contrast); font-family: var(--font-display); font-weight: 800; font-size: 11px; flex-shrink: 0; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-size: 13.5px; font-weight: 700; color: var(--text); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-sub { font-size: 11.5px; color: var(--text-soft); margin: 2px 0 0; }
  .rank-value { font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; white-space: nowrap; }
  .rank-value-rating { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 13px; color: #CA8A04; flex-shrink: 0; }
  .year-group { margin-bottom: 18px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; }
  .year-group:last-child { margin-bottom: 0; }
  .year-group-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px; margin-bottom: 4px; }
  .year-group-title { font-family: var(--font-display); font-weight: 800; font-size: 15px; margin: 0; }
  .year-group-stats { font-size: 11.5px; color: var(--text-soft); }
  .month-chart { display: flex; align-items: flex-end; gap: 4px; margin-top: 14px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .month-col-count { font-size: 10px; font-weight: 700; color: var(--text-soft); height: 13px; font-variant-numeric: tabular-nums; }
  .month-col-track { width: 100%; max-width: 18px; height: 84px; display: flex; align-items: flex-end; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .month-col-fill { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 0; }
  .month-col-label { font-size: 9.5px; color: var(--text-faint); margin-top: 4px; }
  .year-top5-heading { font-size: 11px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.02em; margin: 10px 0 2px; text-transform: uppercase; }
  .dash-empty { font-size: 13px; color: var(--text-soft); text-align: center; padding: 30px 0; }

  main { padding: 16px 16px 40px; }
  .error-banner { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }

  /* Home / dashboard */
  .welcome-row { margin: 0 0 4px; font-size: 22px; color: var(--text); font-weight: 500; }
  .welcome-name { font-family: var(--font-script); font-size: 30px; font-weight: 400; color: var(--accent); cursor: pointer; margin-left: 3px; }
  .pages-read-row { margin: 0 0 16px; font-size: 13.5px; color: var(--text-soft); }
  .pages-read-row strong { color: var(--accent); font-weight: 800; }
  .header-actions { display: flex; gap: 2px; }
  .section-title { font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 14px; }
  .dashboard { padding: 18px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
  .chart { display: flex; flex-direction: column; gap: 14px; }
  .chart-row { display: flex; align-items: center; gap: 10px; }
  .chart-label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--text-soft); width: 108px; flex-shrink: 0; }
  .chart-dot { width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; }
  .chart-bar-track { flex: 1; height: 8px; border-radius: 9999px; background: var(--bg); overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 9999px; }
  .chart-count { font-size: 13px; font-weight: 600; color: var(--text-soft); width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .home-view { padding-bottom: 90px; }
  .dashboard + .dashboard { margin-top: 14px; }
  .reading-list { display: flex; flex-direction: column; gap: 16px; }
  .reading-row { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .cover-reading { width: 44px; flex-shrink: 0; }
  .reading-info { flex: 1; min-width: 0; }
  .reading-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .reading-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reading-pct { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .reading-author { font-size: 11.5px; color: var(--text-soft); margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reading-pages { font-size: 11px; color: var(--text-faint); margin: 6px 0 0; }
  .reading-empty { font-size: 13px; color: var(--text-soft); text-align: center; padding: 10px 0 2px; }
  .btn-add-fab-square { position: fixed; bottom: 22px; right: max(18px, calc(50% - 302px)); width: 58px; height: 58px; border-radius: 18px; background: var(--accent); color: var(--accent-contrast); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 24px rgba(var(--accent-rgb), 0.32); z-index: 30; }

  /* Library toolbar */
  .lib-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .view-toggle { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .view-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: none; background: none; cursor: pointer; color: var(--text-faint); }
  .view-btn.active { background: var(--accent); color: var(--accent-contrast); }
  .icon-add-btn { width: 36px; height: 36px; border-radius: 9999px; background: var(--accent); color: var(--accent-contrast); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-box { flex: 2; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
  .search-box input { border: none; outline: none; background: transparent; width: 100%; padding: 10px 0; font-size: 14px; font-family: inherit; color: var(--text); }
  .custom-select-wrap { position: relative; flex: 1; min-width: 0; }
  .custom-select-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 12.5px; padding: 0 8px; height: 100%; border-radius: 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); font-family: inherit; cursor: pointer; }
  .custom-select-trigger svg { flex-shrink: 0; color: var(--text-faint); }
  .custom-select-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .custom-select-menu { position: absolute; top: calc(100% + 6px); min-width: 168px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,0.14); overflow: hidden; z-index: 35; }
  .custom-select-menu-left { left: 0; }
  .custom-select-menu-right { right: 0; }
  .custom-select-option { display: block; width: 100%; text-align: left; padding: 10px 14px; font-size: 13.5px; font-family: inherit; background: none; border: none; color: var(--text); cursor: pointer; }
  .custom-select-option + .custom-select-option { border-top: 1px solid var(--border); }
  .custom-select-option.active { color: var(--accent); font-weight: 700; background: rgba(var(--accent-rgb), 0.08); }

  /* List view */
  .list-view { display: flex; flex-direction: column; gap: 6px; }
  .item { border-radius: 14px; padding: 10px; background: var(--surface); border: 1px solid var(--border); }
  .item-row { display: flex; gap: 10px; cursor: pointer; position: relative; }
  .cover { border-radius: 6px; overflow: hidden; aspect-ratio: 2/3; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text-faint); flex-shrink: 0; position: relative; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-list { width: 48px; }
  .item-info { flex: 1; min-width: 0; padding-right: 46px; }
  .item-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; margin: 0; line-height: 1.32; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-author { font-size: 12.5px; color: var(--text-soft); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rate-plain { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; color: #CA8A04; position: absolute; top: 0; right: 0; }
  .rate-plain svg { flex-shrink: 0; }
  .item-publisher { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; margin: 5px 0 0; }
  .item-date-range { font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; margin: 4px 0 0; }

  /* Grid view */
  .grid-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid-view .item { padding: 5px; border-radius: 10px; min-width: 0; }
  .grid-top { cursor: pointer; }
  .cover-grid { width: 100%; margin-bottom: 5px; }
  .rate-badge-grid { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 9.5px; font-variant-numeric: tabular-nums; color: #FCD34D; background: rgba(0,0,0,0.55); padding: 2.5px 7px; border-radius: 9999px; position: absolute; top: 4px; right: 4px; backdrop-filter: blur(2px); }
  .rate-badge-grid svg { width: 9px; height: 9px; flex-shrink: 0; }
  .lang-badge { position: absolute; top: 4px; left: 4px; display: inline-flex; align-items: center; font-weight: 800; font-size: 8px; letter-spacing: 0.02em; color: #E4E4E7; background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 9999px; line-height: 1.4; backdrop-filter: blur(2px); }
  .lang-badge-grid { position: absolute; top: 4px; left: 4px; display: inline-flex; align-items: center; font-weight: 800; font-size: 9.5px; letter-spacing: 0.02em; color: #E4E4E7; background: rgba(0,0,0,0.55); padding: 3px 8px; border-radius: 9999px; line-height: 1.4; backdrop-filter: blur(2px); }
  .item-title-grid { font-family: var(--font-display); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; font-weight: 700; line-height: 1.3; }
  .item-author-grid { font-size: 9.5px; margin: 2px 0 0; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-publisher-grid { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .status-mini-grid { margin: 4px 0 0; font-size: 8.5px; padding: 1.5px 6px; }

  /* Detail modal (shared) */
  .status-mini { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; margin-top: 5px; }
  .status-mini-detail { font-size: 12px; padding: 4px 12px; margin-top: 0; }
  .cover-detail { width: 106px; flex-shrink: 0; margin: 0; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .detail-head-info { flex: 1; min-width: 0; padding-top: 2px; }
  .detail-book-title { font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0 0 4px; line-height: 1.3; }
  .detail-book-author { font-size: 13.5px; color: var(--accent); font-weight: 600; margin: 0 0 3px; }
  .detail-book-translator { font-size: 12px; color: var(--text-faint); margin: 0 0 6px; }
  .detail-book-publisher { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 600; margin: 0 0 8px; }
  .detail-rating { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; color: #CA8A04; }
  .detail-status-row { margin-top: 8px; }
  .detail-info-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 12px; column-gap: 10px; font-size: 12.5px; color: var(--text-soft); margin-bottom: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; }
  .detail-info-grid .label { color: var(--text-faint); margin-right: 3px; }
  .review-box { margin: 0 0 4px; padding: 14px; background: #F5F5F6; border: 1px solid var(--border); border-radius: 10px; }
  .review-heading { font-size: 11px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.02em; margin: 0 0 6px; }
  .review-text { font-size: 13px; line-height: 1.6; color: var(--text); margin: 0; text-align: justify; }
  .action-row { display: flex; gap: 12px; margin-top: 12px; align-items: center; }
  .btn-ghost { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--text); font-family: inherit; }
  .btn-danger { color: #B91C1C; }
  .confirm-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .confirm-row button { background: none; border: none; cursor: pointer; font-family: inherit; font-size: 12px; }

  .empty-state { text-align: center; padding: 56px 16px; color: var(--text-soft); }
  .empty-state svg { color: var(--text-faint); }
  .empty-title { font-weight: 600; color: var(--text); margin: 12px 0 4px; }
  .empty-sub { font-size: 14px; }

  .backup-row-footer { text-align: center; margin-top: 20px; font-size: 12px; }
  .link-btn { background: none; border: none; padding: 0; font-size: 12px; color: var(--text-faint); text-decoration: underline; cursor: pointer; font-family: inherit; }

  /* Modal / form */
  .modal { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
  .modal-inner { max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; height: 100%; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .modal-header button { background: none; border: none; cursor: pointer; color: var(--text-soft); }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .field { display: block; margin-bottom: 16px; }
  .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-soft); margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-family: inherit; color: var(--text); outline: none; }
  .field textarea { resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 12px; margin: 8px 0 32px; }
  .btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--text); font-family: inherit; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 6px; }

  .cover-field { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
  .cover-preview { width: 64px; flex-shrink: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 2/3; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-faint); }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-actions { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .btn-secondary-sm { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; font-family: inherit; }
  .cover-url-input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-family: inherit; color: var(--text-soft); outline: none; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .celebration-overlay { position: absolute; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; border-radius: inherit; }
  .confetti-piece { position: absolute; opacity: 0; animation-name: confetti-fall; animation-timing-function: cubic-bezier(0.25,0.46,0.45,0.94); animation-fill-mode: forwards; }
  @keyframes confetti-fall {
    0% { transform: translate(-50%, -50%) translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
    10% { opacity: 1; }
    40% { transform: translate(-50%, -50%) translateY(var(--peak, -30vh)) translateX(calc(var(--drift, 0px) * 0.35)) rotate(calc(var(--spin, 540deg) * 0.4)) scale(1); }
    100% { transform: translate(-50%, -50%) translateY(85vh) translateX(var(--drift, 0px)) rotate(var(--spin, 540deg)) scale(1); opacity: 0.85; }
  }
  .achievement-body { display: flex; flex-direction: column; align-items: center; padding: 24px 20px 32px; position: relative; overflow: hidden; }
  .achievement-card { position: relative; z-index: 6; width: 100%; max-width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 20px 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.12); }

const ACCENT_KEY = 'reading-log-v2-accent';
const ACCENT_PRESETS_KEY = 'reading-log-v2-accent-presets';
const DEFAULT_ACCENT_PRESETS = ['#0CBAA6', '#857686', '#E9A4A4', '#C1DCDC', '#F4A6B6', '#D0C5B1'];

function loadAccentPresets() {
  try {
    const raw = localStorage.getItem(ACCENT_PRESETS_KEY);
    const arr = raw ? JSON.parse(raw) : null;
    return Array.isArray(arr) && arr.length === 6 ? arr : [...DEFAULT_ACCENT_PRESETS];
  } catch (e) { return [...DEFAULT_ACCENT_PRESETS]; }
}
function saveAccentPresets() {
  try { localStorage.setItem(ACCENT_PRESETS_KEY, JSON.stringify(ACCENT_PRESETS)); } catch (e) {}
}
function isValidHex(hex) {
  return /^#[0-9A-Fa-f]{6}$/.test(hex);
}

let ACCENT_PRESETS = loadAccentPresets();

function loadAccent() {
  try { return localStorage.getItem(ACCENT_KEY) || '#0CBAA6'; }
  catch (e) { return '#0CBAA6'; }
}
function saveAccentToStorage(hex) {
  try { localStorage.setItem(ACCENT_KEY, hex); } catch (e) {}
}
function hexToRgbString(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `${r}, ${g}, ${b}`;
}
function getContrastTextColor(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) / 255;
  const g = parseInt(h.substring(2, 4), 16) / 255;
  const b = parseInt(h.substring(4, 6), 16) / 255;
  const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return lum > 0.5 ? '#18181B' : '#FFFFFF';
}
function darkenHex(hex, factor) {
  factor = factor == null ? 0.62 : factor;
  const h = hex.replace('#', '');
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = clamp(parseInt(h.substring(0, 2), 16) * factor);
  const g = clamp(parseInt(h.substring(2, 4), 16) * factor);
  const b = clamp(parseInt(h.substring(4, 6), 16) * factor);
  return `#${[r, g, b].map(v => v.toString(16).padStart(2, '0')).join('')}`;
}
function applyAccent(hex) {
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-rgb', hexToRgbString(hex));
  document.documentElement.style.setProperty('--accent-contrast', getContrastTextColor(hex));
  document.documentElement.style.setProperty('--accent-dark', darkenHex(hex));
}

const SAVED_ACCENT = loadAccent();
applyAccent(SAVED_ACCENT);

let state = {
  books: loadBooks(),
  userName: loadName(),
  accentColor: SAVED_ACCENT,
  showSettings: false,
  showDashboard: false,
  dashboardCategory: 'all',
  query: '',
  sortBy: '',
  statusFilter: '',
  openDropdown: null,
  showNameEdit: false,
  nameEditValue: '',
  editingPresetIndex: null,
  presetEditValue: '',
  presetEditError: '',
  showAchievement: false,
  achievementBook: null,
  activeTab: 'home',
  libraryView: 'list',
  expandedId: null,
  confirmDeleteId: null,
  showForm: false,
  editingId: null,
  form: { ...emptyForm },
  error: ''
};

function loadBooks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : [];
    return Array.isArray(data) ? data : [];
  } catch (e) { return []; }
}
function loadName() {
  try { return localStorage.getItem(NAME_KEY) || 'Reader'; }
  catch (e) { return 'Reader'; }
}
function saveName() {
  try { localStorage.setItem(NAME_KEY, state.userName); }
  catch (e) {}
}
function saveBooks() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.books)); state.error = ''; }
  catch (e) { state.error = 'Failed to save changes. Please try again.'; }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function getBookStatus(b) {
  if (b.status) return b.status;
  if (b.startDate && b.endDate) return 'done';
  if (b.startDate) return 'ongoing';
  return 'tbr';
}
function formatDate(d) { if (!d) return '-'; try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return d; } }
function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function getLangBadge(lang) {
  if (!lang) return '';
  const key = lang.trim().toLowerCase();
  const map = {
    indonesian: 'ID', 'bahasa indonesia': 'ID', indonesia: 'ID',
    english: 'EN',
    japanese: 'JP',
    french: 'FR',
    german: 'DE',
    spanish: 'ES',
    korean: 'KR',
    chinese: 'CN', mandarin: 'CN',
    arabic: 'AR',
    russian: 'RU',
    italian: 'IT',
    portuguese: 'PT',
    dutch: 'NL',
    thai: 'TH',
    vietnamese: 'VN',
    hindi: 'HI',
    turkish: 'TR'
  };
  if (map[key]) return map[key];
  return lang.trim().slice(0, 3).toUpperCase();
}

function getPagesReadForBook(b) {
  const status = getBookStatus(b);
  const total = Number(b.totalPages) || 0;
  const current = Number(b.currentPage) || 0;
  if (status === 'done') return total;
  if (status === 'ongoing' || status === 'dnf') return total ? Math.min(current, total) : current;
  return 0;
}
function getTotalPagesRead(books) {
  return books.reduce((sum, b) => sum + getPagesReadForBook(b), 0);
}
function daysBetween(start, end) {
  try {
    const d1 = new Date(start + 'T00:00:00');
    const d2 = new Date(end + 'T00:00:00');
    const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    return Math.max(1, diff + 1);
  } catch (e) { return 1; }
}
function rankBy(books, keyFn) {
  const map = new Map();
  books.forEach(b => {
    const key = keyFn(b);
    if (!key) return;
    map.set(key, (map.get(key) || 0) + 1);
  });
  return [...map.entries()].sort((a, b) => b[1] - a[1]);
}
function getPagesPerDayRanking(books) {
  return books
    .filter(b => getBookStatus(b) === 'done' && b.startDate && b.endDate && Number(b.totalPages) > 0)
    .map(b => {
      const days = daysBetween(b.startDate, b.endDate);
      return { title: b.title, author: b.author, pages: Number(b.totalPages), days, rate: Number(b.totalPages) / days };
    })
    .sort((a, b) => b.rate - a.rate);
}
function getYearGrouping(books) {
  const map = new Map();
  books.forEach(b => {
    if (getBookStatus(b) !== 'done' || !b.endDate) return;
    const year = b.endDate.slice(0, 4);
    if (!map.has(year)) map.set(year, { year, books: [], totalPages: 0 });
    const entry = map.get(year);
    entry.books.push(b);
    entry.totalPages += Number(b.totalPages) || 0;
  });
  return [...map.values()]
    .sort((a, b) => b.year.localeCompare(a.year))
    .map(e => ({
      year: e.year,
      count: e.books.length,
      totalPages: e.totalPages,
      perDay: e.totalPages / 365,
      top5: [...e.books].sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0)).slice(0, 5)
    }));
}

const FILTER_OPTIONS = [
  { value: 'all', label: 'All' },
  { value: 'tbr', label: 'To be Read' },
  { value: 'ongoing', label: 'Reading' },
  { value: 'dnf', label: "Didn't Finish" },
  { value: 'done', label: 'Done' }
];
const SORT_OPTIONS = [
  { value: 'added', label: 'Newest' },
  { value: 'rating', label: 'Rating' },
  { value: 'finished', label: 'Finished Reading' },
  { value: 'title', label: 'Title A-Z' }
];

function renderCustomSelect(key, options, currentValue, align) {
  const placeholder = key === 'filter' ? 'Filter by' : key === 'sort' ? 'Sort by' : 'Select';
  const current = options.find(o => o.value === currentValue);
  const label = current ? current.label : placeholder;
  const isOpen = state.openDropdown === key;
  return `
    <div class="custom-select-wrap">
      <button type="button" class="custom-select-trigger" data-action="toggle-dropdown" data-dropdown="${key}" aria-haspopup="listbox" aria-expanded="${isOpen}">
        <span class="custom-select-label">${esc(label)}</span>
        ${ICONS.chevronDown}
      </button>
      ${isOpen ? `
        <div class="custom-select-menu custom-select-menu-${align}" role="listbox">
          ${options.map(o => `
            <button type="button" class="custom-select-option ${o.value === currentValue ? 'active' : ''}" data-action="pick-option" data-dropdown="${key}" data-value="${o.value}">
              ${esc(o.label)}
            </button>`).join('')}
        </div>` : ''}
    </div>`;
}

function getFiltered() {
  const q = state.query.trim().toLowerCase();
  let list = state.books.filter(b => {
    if (state.statusFilter && state.statusFilter !== 'all' && getBookStatus(b) !== state.statusFilter) return false;
    if (!q) return true;
    return [b.title, b.author, b.publisher, b.country, b.translator, b.language].some(v => (v || '').toLowerCase().includes(q));
  });
  list = [...list].sort((a, b) => {
    if (state.sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
    if (state.sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
    if (state.sortBy === 'finished') {
      const order = { done: 0, ongoing: 1, tbr: 2, dnf: 3 };
      const diff = order[getBookStatus(a)] - order[getBookStatus(b)];
      if (diff !== 0) return diff;
      return (b.endDate || '').localeCompare(a.endDate || '');
    }
    return (b.addedAt || 0) - (a.addedAt || 0);
  });
  return list;
}

function openAddForm() { state.form = { ...emptyForm }; state.editingId = null; state.showForm = true; render(); }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div class="header-top-row">
        <h1 class="title">Book Tracking<span class="header-name" data-action="edit-name">${esc(state.userName)}</span></h1>
        <div class="header-actions">
          <button class="settings-btn" id="dashboard-btn" aria-label="Dashboard">${ICONS.chart}</button>
          <button class="settings-btn" id="settings-btn" aria-label="Settings">${ICONS.gear}</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn ${state.activeTab === 'home' ? 'active' : ''}" id="tab-home-btn">${ICONS.home}<span>Home</span></button>
        <button class="tab-btn ${state.activeTab === 'library' ? 'active' : ''}" id="tab-library-btn">${ICONS.library}<span>Library</span></button>
      </div>
    </div>
    <main>
      ${state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ''}
      ${state.activeTab === 'home' ? renderHome() : renderLibrary()}
    </main>
    ${state.expandedId ? renderDetailModal(state.books.find(b => b.id === state.expandedId)) : ''}
    ${state.showSettings ? renderSettingsModal() : ''}
    ${state.editingPresetIndex !== null ? renderPresetEditModal() : ''}
    ${state.showDashboard ? renderDashboardModal() : ''}
    ${state.showNameEdit ? renderNameEditModal() : ''}
    ${state.showAchievement ? renderAchievementModal() : ''}
    ${state.showForm ? renderForm() : ''}
  `;
  attachHandlers();
}

function getStatusColor(key) {
  return key === 'done' ? 'var(--accent)' : STATUS_META[key].color;
}
function getStatusPillStyle(key) {
  if (key === 'done') {
    return `background:rgba(var(--accent-rgb),0.1);color:var(--accent);border:1px solid rgba(var(--accent-rgb),0.33);`;
  }
  const c = STATUS_META[key].color;
  return `background:${c}1A;color:${c};border:1px solid ${c}55;`;
}

function renderHome() {
  const counts = { tbr: 0, ongoing: 0, dnf: 0, done: 0 };
  state.books.forEach(b => { const s = getBookStatus(b); if (counts[s] != null) counts[s]++; });
  const total = state.books.length;
  const max = Math.max(1, ...Object.values(counts));
  const rows = STATUS_ORDER.map(key => {
    const meta = STATUS_META[key];
    const color = getStatusColor(key);
    const count = counts[key];
    const pct = Math.round((count / max) * 100);
    return `
      <div class="chart-row">
        <div class="chart-label"><span class="chart-dot" style="background:${color}"></span><span>${meta.label}</span></div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="chart-count">${count}</span>
      </div>`;
  }).join('');
  const readingBooks = state.books.filter(b => getBookStatus(b) === 'ongoing');
  const readingRows = readingBooks.map(b => {
    const pct = getReadingPct(b);
    const totalPages = Number(b.totalPages) || 0;
    const currentPage = Math.min(Number(b.currentPage) || 0, totalPages || (Number(b.currentPage) || 0));
    const barColor = getReadingBarColor(pct);
    return `
      <div class="reading-row" data-action="toggle" data-id="${b.id}">
        <div class="cover cover-reading">${b.coverUrl ? `<img src="${esc(b.coverUrl)}" alt="" onerror="this.style.display='none'" />` : ICONS.book}${b.language ? `<span class="lang-badge">${esc(getLangBadge(b.language))}</span>` : ''}</div>
        <div class="reading-info">
          <div class="reading-row-top">
            <span class="reading-title">${esc(b.title)}</span>
            <span class="reading-pct" style="color:${barColor}">${pct}%</span>
          </div>
          <p class="reading-author">${esc(b.author)}</p>
          <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <p class="reading-pages">${totalPages ? `${currentPage}/${totalPages} pages` : 'Total pages not set yet'}</p>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="home-view">
      <p class="welcome-row">Welcome! <span class="welcome-name" data-action="edit-name">${esc(state.userName)}</span></p>
      <p class="pages-read-row">You've read <strong>${getTotalPagesRead(state.books)}</strong> pages so far</p>
      <div class="dashboard">
        <p class="section-title">Summary</p>
        <div class="chart">${rows}</div>
      </div>
      <div class="dashboard">
        <p class="section-title">Reading</p>
        ${readingBooks.length ? `<div class="reading-list">${readingRows}</div>` : `<p class="reading-empty">No books currently being read.</p>`}
      </div>
    </div>
    <button class="btn-add-fab-square" id="add-btn-home" aria-label="Add Book">${ICONS.plus}</button>
  `;
}

function getReadingPct(book) {
  const total = Number(book.totalPages) || 0;
  if (!total || total <= 0) return 0;
  if (getBookStatus(book) === 'done') return 100;
  const current = Number(book.currentPage) || 0;
  return Math.max(0, Math.min(100, Math.round((current / total) * 100)));
}

function getReadingBarColor(pct) {
  if (pct < 100 / 3) return '#FF5555';
  if (pct <= 200 / 3) return '#FFC118';
  return '#82c8e5';
}

function formatDateShort(d) {
  if (!d) return '';
  try {
    const dt = new Date(d + 'T00:00:00');
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const day = String(dt.getDate()).padStart(2, '0');
    return `${y}.${m}.${day}`;
  } catch (e) { return ''; }
}

function renderConfettiPieces(count) {
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0CBAA6';
  const colors = ['#F59E0B', '#22C55E', '#3B82F6', '#EC4899', '#EF4444', '#8B5CF6', '#FACC15', accent];
  const shapes = ['square', 'circle', 'ribbon', 'star'];
  const starClip = 'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)';
  let html = '';
  for (let i = 0; i < count; i++) {
    const left = 25 + Math.random() * 50;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const delay = (Math.random() * 0.5).toFixed(2);
    const duration = (2.2 + Math.random() * 1.4).toFixed(2);
    const drift = (Math.random() * 160 - 80).toFixed(0);
    const spin = (360 + Math.random() * 720).toFixed(0);
    const peak = -(20 + Math.random() * 28).toFixed(0);
    let shapeCss;
    if (shape === 'circle') {
      const d = 7 + Math.random() * 8;
      shapeCss = `width:${d}px;height:${d}px;border-radius:9999px;`;
    } else if (shape === 'ribbon') {
      const w = 3 + Math.random() * 2;
      const h = 22 + Math.random() * 18;
      shapeCss = `width:${w}px;height:${h}px;border-radius:2px;`;
    } else if (shape === 'star') {
      const d = 13 + Math.random() * 8;
      shapeCss = `width:${d}px;height:${d}px;clip-path:${starClip};`;
    } else {
      const w = 6 + Math.random() * 8;
      const h = w * 0.6;
      shapeCss = `width:${w}px;height:${h}px;border-radius:2px;`;
    }
    html += `<div class="confetti-piece" style="left:${left}%;top:55%;${shapeCss}background:${color};animation-delay:${delay}s;animation-duration:${duration}s;--drift:${drift}px;--spin:${spin}deg;--peak:${peak}vh;"></div>`;
  }
  return html;
}

function renderCountRanking(entries) {
  if (!entries.length) return `<p class="dash-empty">No data yet.</p>`;
  const max = Math.max(...entries.map(([, count]) => count));
  return entries.map(([name, count]) => {
    const pct = Math.round((count / max) * 100);
    const opacity = (0.3 + 0.7 * (count / max)).toFixed(2);
    return `
      <div class="bar-rank-row">
        <div class="bar-rank-label">
          <span class="bar-rank-name">${esc(name)}</span>
          <span class="bar-rank-count">${count} book${count === 1 ? '' : 's'}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:rgba(var(--accent-rgb),${opacity});"></div></div>
      </div>`;
  }).join('');
}

function getYearMonthlyBreakdown(books) {
  const map = new Map();
  books.forEach(b => {
    if (getBookStatus(b) !== 'done' || !b.endDate) return;
    const year = b.endDate.slice(0, 4);
    const month = parseInt(b.endDate.slice(5, 7), 10) - 1;
    if (!map.has(year)) map.set(year, new Array(12).fill(0));
    if (month >= 0 && month < 12) map.get(year)[month]++;
  });
  return [...map.entries()]
    .sort((a, b) => b[0].localeCompare(a[0]))
    .map(([year, counts]) => ({ year, counts, total: counts.reduce((s, c) => s + c, 0) }));
}

function renderYearMonthlyBreakdown() {
  const groups = getYearMonthlyBreakdown(state.books);
  if (!groups.length) return `<p class="dash-empty">No data yet. Set an End Date on a book.</p>`;
  const monthLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return groups.map(g => {
    const max = Math.max(1, ...g.counts);
    const bars = g.counts.map((c, i) => {
      const pct = Math.max(c > 0 ? 6 : 0, Math.round((c / max) * 100));
      return `
        <div class="month-col">
          <span class="month-col-count">${c || ''}</span>
          <div class="month-col-track"><div class="month-col-fill" style="height:${pct}%;"></div></div>
          <span class="month-col-label">${monthLabels[i]}</span>
        </div>`;
    }).join('');
    return `
      <div class="year-group">
        <div class="year-group-head">
          <span class="year-group-title">${esc(g.year)}</span>
          <span class="year-group-stats">${g.total} book${g.total === 1 ? '' : 's'} done</span>
        </div>
        <div class="month-chart">${bars}</div>
      </div>`;
  }).join('');
}

function renderForm() {
  const f = state.form;
  const ratingVal = Number(f.rating) || 1;
  return `
    <div class="modal">
      <div class="modal-inner">
        <div class="modal-header">
          <h2>${state.editingId ? 'Edit book' : 'Add Book'}</h2>
          <button id="close-form" aria-label="Close">${ICONS.x}</button>
        </div>
        <form id="book-form" class="modal-body">
          <div class="cover-field">
            <div class="cover-preview" id="cover-preview">${f.coverUrl ? `<img src="${esc(f.coverUrl)}" alt="" onerror="this.style.display='none'" />` : ICONS.book}</div>
            <div class="cover-actions">
              <span class="field-label" style="margin:0;">Book Cover</span>
              <button type="button" class="btn-secondary-sm" id="pick-cover-btn">${ICONS.image} Choose from gallery</button>
              <input type="file" id="f-cover-file" accept="image/*" hidden />
              <input id="f-cover-url" class="cover-url-input" placeholder="or paste a URL" value="${f.coverUrl && f.coverUrl.startsWith('data:') ? '' : esc(f.coverUrl)}" />
            </div>
          </div>
          <label class="field"><span class="field-label">Book Title *</span><input required id="f-title" value="${esc(f.title)}" placeholder="e.g. The Great Gatsby" /></label>
          <label class="field"><span class="field-label">Author *</span><input required id="f-author" value="${esc(f.author)}" /></label>
          <label class="field"><span class="field-label">Translator</span><input id="f-translator" value="${esc(f.translator)}" placeholder="if a translated book" /></label>
          <div class="grid-2">
            <label class="field"><span class="field-label">Publisher</span><input id="f-publisher" value="${esc(f.publisher)}" /></label>
            <label class="field"><span class="field-label">Language</span><input id="f-language" value="${esc(f.language)}" placeholder="e.g. English" /></label>
          </div>
          <div class="grid-2">
            <label class="field"><span class="field-label">Origin Country</span><input id="f-country" value="${esc(f.country)}" placeholder="e.g. Japan" /></label>
            <label class="field"><span class="field-label">Origin Year</span><input type="number" id="f-origin-year" value="${esc(f.originYear)}" placeholder="e.g. 1811" /></label>
          </div>
          <label class="field"><span class="field-label">ISBN</span><input id="f-isbn" value="${esc(f.isbn)}" /></label>
          <label class="field"><span class="field-label">Status</span>
            <select id="f-status">
              <option value="tbr" ${f.status === 'tbr' ? 'selected' : ''}>To be Read</option>
              <option value="ongoing" ${f.status === 'ongoing' ? 'selected' : ''}>Reading</option>
              <option value="dnf" ${f.status === 'dnf' ? 'selected' : ''}>Didn't Finish</option>
              <option value="done" ${f.status === 'done' ? 'selected' : ''}>Done</option>
            </select>
          </label>
          <div class="grid-2">
            <label class="field"><span class="field-label">Start Date</span><input type="date" id="f-start" value="${esc(f.startDate)}" /></label>
            <label class="field"><span class="field-label">End Date</span><input type="date" id="f-end" value="${esc(f.endDate)}" /></label>
          </div>
          ${(f.status === 'ongoing' || f.status === 'dnf') ? `
          <div class="grid-2" id="pages-field-row">
            <label class="field"><span class="field-label">Last page read</span><input type="number" min="0" id="f-current-page" value="${esc(f.currentPage)}" placeholder="e.g. 120" /></label>
            <label class="field"><span class="field-label">Total pages</span><input type="number" min="0" id="f-total-pages" value="${esc(f.totalPages)}" placeholder="e.g. 320" /></label>
          </div>` : ''}
          ${f.status === 'done' ? `
          <label class="field"><span class="field-label">Total pages</span><input type="number" min="0" id="f-total-pages" value="${esc(f.totalPages)}" placeholder="e.g. 320" /></label>` : ''}
          <label class="field"><span class="field-label" id="rating-label">Rating — ${ratingVal.toFixed(1)}/10</span><input type="range" min="1" max="10" step="0.1" id="f-rating" value="${ratingVal}" style="width:100%;accent-color:var(--accent);" /></label>
          <label class="field"><span class="field-label">What Stayed</span><textarea id="f-review" rows="4" placeholder="Your brief thoughts about this book...">${esc(f.review)}</textarea></label>
          <div class="form-actions">
            <button type="button" id="cancel-form" class="btn">Cancel</button>
            <button type="submit" class="btn btn-primary">${ICONS.check} Save</button>
          </div>
        </form>
      </div>
    </div>`;
}
