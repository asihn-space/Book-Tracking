<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Tracking</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#18181B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@600;700&family=Sacramento&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --border: #E4E4E7;
    --text: #18181B;
    --text-soft: #71717A;
    --text-faint: #A1A1AA;
    --accent: #0CBAA6;
    --accent-rgb: 12, 186, 166;
    --accent-contrast: #FFFFFF;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-title: 'Playfair Display', Georgia, serif;
    --font-title-home: 'Source Serif 4', Georgia, serif;
    --font-script: 'Sacramento', cursive;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); }
  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
  .header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); padding: 20px 16px 14px; }
  .title { font-family: var(--font-display); font-size: 21px; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .header-name { font-family: var(--font-script); font-size: 26px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--accent); margin-left: 4px; vertical-align: middle; }
  .tabs { display: flex; gap: 4px; margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
  .tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 0; border-radius: 8px; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-soft); }
  .tab-btn.active { background: var(--accent); color: var(--accent-contrast); }
  .header-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .settings-btn { background: none; border: none; cursor: pointer; color: var(--text-soft); padding: 4px; margin-top: 1px; flex-shrink: 0; }
  .swatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .swatch-btn { width: 100%; aspect-ratio: 1; border-radius: 9999px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; outline-offset: 3px; }
  .swatch-btn.active { outline: 3px solid var(--text); }
  .swatch-hint { font-size: 12.5px; color: var(--text-soft); margin: 14px 0 0; }

  main { padding: 16px 16px 40px; }
  .error-banner { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }

  /* Home / dashboard */
  .welcome-row { margin: 0 0 16px; font-size: 15px; color: var(--text); font-weight: 500; }
  .welcome-name { font-family: var(--font-script); font-size: 26px; font-weight: 400; color: var(--accent); cursor: pointer; margin-left: 3px; }
  .section-title { font-family: var(--font-display); font-size: 13px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 14px; }
  .dashboard { padding: 18px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
  .chart { display: flex; flex-direction: column; gap: 14px; }
  .chart-row { display: flex; align-items: center; gap: 10px; }
  .chart-label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--text-soft); width: 108px; flex-shrink: 0; }
  .chart-dot { width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; }
  .chart-bar-track { flex: 1; height: 8px; border-radius: 9999px; background: var(--bg); overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 9999px; }
  .chart-count { font-size: 13px; font-weight: 600; color: var(--text-soft); width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .home-view { padding-bottom: 90px; }
  .dashboard + .dashboard { margin-top: 14px; }
  .reading-list { display: flex; flex-direction: column; gap: 16px; }
  .reading-row { display: flex; gap: 10px; align-items: flex-start; }
  .cover-reading { width: 44px; flex-shrink: 0; }
  .reading-info { flex: 1; min-width: 0; }
  .reading-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .reading-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reading-pct { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .reading-author { font-size: 11.5px; color: var(--text-soft); margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reading-pages { font-size: 11px; color: var(--text-faint); margin: 6px 0 0; }
  .reading-empty { font-size: 13px; color: var(--text-soft); text-align: center; padding: 10px 0 2px; }
  .btn-add-fab-square { position: fixed; bottom: 22px; right: max(18px, calc(50% - 302px)); width: 58px; height: 58px; border-radius: 18px; background: var(--accent); color: var(--accent-contrast); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 24px rgba(var(--accent-rgb), 0.32); z-index: 30; }

  /* Library toolbar */
  .lib-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .view-toggle { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .view-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: none; background: none; cursor: pointer; color: var(--text-faint); }
  .view-btn.active { background: var(--accent); color: var(--accent-contrast); }
  .icon-add-btn { width: 36px; height: 36px; border-radius: 9999px; background: var(--accent); color: var(--accent-contrast); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
  .search-box input { border: none; outline: none; background: transparent; width: 100%; padding: 10px 0; font-size: 14px; font-family: inherit; color: var(--text); }
  .sort-select { font-size: 13px; padding: 0 8px; border-radius: 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); font-family: inherit; }

  /* List view */
  .list-view { display: flex; flex-direction: column; gap: 10px; }
  .item { border-radius: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--border); }
  .item-row { display: flex; gap: 10px; cursor: pointer; position: relative; }
  .cover { border-radius: 6px; overflow: hidden; aspect-ratio: 2/3; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text-faint); flex-shrink: 0; position: relative; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-list { width: 48px; }
  .item-info { flex: 1; min-width: 0; padding-right: 46px; }
  .item-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; margin: 0; line-height: 1.32; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-author { font-size: 12.5px; color: var(--text-soft); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rate-plain { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; color: #CA8A04; position: absolute; top: 0; right: 0; }
  .rate-plain svg { flex-shrink: 0; }
  .item-publisher { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; margin: 5px 0 0; }

  /* Grid view */
  .grid-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid-view .item { padding: 5px; border-radius: 10px; min-width: 0; }
  .grid-top { cursor: pointer; }
  .cover-grid { width: 100%; margin-bottom: 5px; }
  .rate-badge-grid { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 8.5px; font-variant-numeric: tabular-nums; color: #FBBF24; background: rgba(24,24,27,0.8); padding: 1.5px 5px; border-radius: 9999px; position: absolute; top: 4px; right: 4px; }
  .rate-badge-grid svg { width: 8px; height: 8px; flex-shrink: 0; }
  .item-title-grid { font-family: var(--font-display); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; font-weight: 700; line-height: 1.3; }
  .item-author-grid { font-size: 9.5px; margin: 2px 0 0; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-publisher-grid { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .status-mini-grid { margin: 4px 0 0; font-size: 8.5px; padding: 1.5px 6px; }

  /* Detail modal (shared) */
  .status-mini { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; margin-top: 5px; }
  .status-mini-detail { font-size: 12px; padding: 4px 12px; margin-top: 0; }
  .cover-detail { width: 106px; flex-shrink: 0; margin: 0; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .detail-head-info { flex: 1; min-width: 0; padding-top: 2px; }
  .detail-book-title { font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0 0 4px; line-height: 1.3; }
  .detail-book-author { font-size: 13.5px; color: var(--accent); font-weight: 600; margin: 0 0 3px; }
  .detail-book-translator { font-size: 12px; color: var(--text-faint); margin: 0 0 6px; }
  .detail-book-publisher { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 600; margin: 0 0 8px; }
  .detail-rating { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; color: #CA8A04; }
  .detail-status-row { margin-top: 8px; }
  .detail-info-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 12px; column-gap: 10px; font-size: 12.5px; color: var(--text-soft); margin-bottom: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; }
  .detail-info-grid .label { color: var(--text-faint); margin-right: 3px; }
  .review-box { margin: 0 0 4px; padding: 14px; background: #F5F5F6; border: 1px solid var(--border); border-radius: 10px; }
  .review-heading { font-size: 11px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.02em; margin: 0 0 6px; }
  .review-text { font-size: 13px; line-height: 1.6; color: var(--text); margin: 0; text-align: justify; }
  .action-row { display: flex; gap: 12px; margin-top: 12px; align-items: center; }
  .btn-ghost { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--text); font-family: inherit; }
  .btn-danger { color: #B91C1C; }
  .confirm-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .confirm-row button { background: none; border: none; cursor: pointer; font-family: inherit; font-size: 12px; }

  .empty-state { text-align: center; padding: 56px 16px; color: var(--text-soft); }
  .empty-state svg { color: var(--text-faint); }
  .empty-title { font-weight: 600; color: var(--text); margin: 12px 0 4px; }
  .empty-sub { font-size: 14px; }

  .backup-row-footer { text-align: center; margin-top: 20px; font-size: 12px; }
  .link-btn { background: none; border: none; padding: 0; font-size: 12px; color: var(--text-faint); text-decoration: underline; cursor: pointer; font-family: inherit; }

  /* Modal / form */
  .modal { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
  .modal-inner { max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; height: 100%; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .modal-header button { background: none; border: none; cursor: pointer; color: var(--text-soft); }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .field { display: block; margin-bottom: 16px; }
  .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-soft); margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-family: inherit; color: var(--text); outline: none; }
  .field textarea { resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 12px; margin: 8px 0 32px; }
  .btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--text); font-family: inherit; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 6px; }

  .cover-field { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
  .cover-preview { width: 64px; flex-shrink: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 2/3; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-faint); }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-actions { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .btn-secondary-sm { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; font-family: inherit; }
  .cover-url-input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-family: inherit; color: var(--text-soft); outline: none; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY = 'reading-log-v2';
const NAME_KEY = 'reading-log-v2-name';
const emptyForm = { title:'', author:'', translator:'', publisher:'', country:'', originYear:'', isbn:'', coverUrl:'', startDate:'', endDate:'', currentPage:'', totalPages:'', rating:7, review:'', status:'tbr' };

const ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0CBAA6';

const STATUS_ORDER = ['tbr','ongoing','dnf','done'];
const STATUS_META = {
  tbr:     { label: 'To be Read',     color: '#FFC118' },
  ongoing: { label: 'Reading',        color: '#82c8e5' },
  dnf:     { label: "Didn't Finish",  color: '#FF5555' },
  done:    { label: 'Done',           color: ACCENT }
};

const ICONS = {

  edit: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>',

  home: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/><path d="M9 21v-6h6v6"/></svg>',

};

const ACCENT_KEY = 'reading-log-v2-accent';
const ACCENT_PRESETS = ['#0CBAA6', '#857686', '#E9A4A4', '#C1DCDC', '#F4A6B6', '#D0C5B1'];

function loadAccent() {
  try { return localStorage.getItem(ACCENT_KEY) || '#0CBAA6'; }
  catch (e) { return '#0CBAA6'; }
}
function saveAccentToStorage(hex) {
  try { localStorage.setItem(ACCENT_KEY, hex); } catch (e) {}
}
function hexToRgbString(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `${r}, ${g}, ${b}`;
}
function getContrastTextColor(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) / 255;
  const g = parseInt(h.substring(2, 4), 16) / 255;
  const b = parseInt(h.substring(4, 6), 16) / 255;
  const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return lum > 0.5 ? '#18181B' : '#FFFFFF';
}
function applyAccent(hex) {
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-rgb', hexToRgbString(hex));
  document.documentElement.style.setProperty('--accent-contrast', getContrastTextColor(hex));
}

const SAVED_ACCENT = loadAccent();
applyAccent(SAVED_ACCENT);

let state = {
  books: loadBooks(),
  userName: loadName(),
  accentColor: SAVED_ACCENT,
  showSettings: false,
  query: '',
  sortBy: 'added',
  activeTab: 'home',
  libraryView: 'list',
  expandedId: null,
  confirmDeleteId: null,
  showForm: false,
  editingId: null,
  form: { ...emptyForm },
  error: ''
};

function loadBooks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : [];
    return Array.isArray(data) ? data : [];
  } catch (e) { return []; }
}
function loadName() {
  try { return localStorage.getItem(NAME_KEY) || 'Reader'; }
  catch (e) { return 'Reader'; }
}
function saveName() {
  try { localStorage.setItem(NAME_KEY, state.userName); }
  catch (e) {}
}
function saveBooks() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.books)); state.error = ''; }
  catch (e) { state.error = 'Failed to save changes. Please try again.'; }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function getBookStatus(b) {
  if (b.status) return b.status;
  if (b.startDate && b.endDate) return 'done';
  if (b.startDate) return 'ongoing';
  return 'tbr';
}
function formatDate(d) { if (!d) return '-'; try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return d; } }
function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function getFiltered() {
  const q = state.query.trim().toLowerCase();
  let list = state.books.filter(b => {
    if (!q) return true;
    return [b.title, b.author, b.publisher, b.country, b.translator].some(v => (v || '').toLowerCase().includes(q));
  });
  list = [...list].sort((a, b) => {
    if (state.sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
    if (state.sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
    if (state.sortBy === 'finished') return (b.endDate || '').localeCompare(a.endDate || '');
    return (b.addedAt || 0) - (a.addedAt || 0);
  });
  return list;
}

function openAddForm() { state.form = { ...emptyForm }; state.editingId = null; state.showForm = true; render(); }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div class="header-top-row">
        <h1 class="title">Book Tracking<span class="header-name" data-action="edit-name">${esc(state.userName)}</span></h1>
        <button class="settings-btn" id="settings-btn" aria-label="Settings">${ICONS.gear}</button>
      </div>
      <div class="tabs">
        <button class="tab-btn ${state.activeTab === 'home' ? 'active' : ''}" id="tab-home-btn">${ICONS.home}<span>Home</span></button>
        <button class="tab-btn ${state.activeTab === 'library' ? 'active' : ''}" id="tab-library-btn">${ICONS.library}<span>Library</span></button>
      </div>
    </div>
    <main>
      ${state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ''}

function renderHome() {
  const counts = { tbr: 0, ongoing: 0, dnf: 0, done: 0 };
  state.books.forEach(b => { const s = getBookStatus(b); if (counts[s] != null) counts[s]++; });
  const total = state.books.length;
  const max = Math.max(1, ...Object.values(counts));
  const rows = STATUS_ORDER.map(key => {
    const meta = STATUS_META[key];
    const count = counts[key];
    const pct = Math.round((count / max) * 100);
    return `
      <div class="chart-row">
        <div class="chart-label"><span class="chart-dot" style="background:${meta.color}"></span><span>${meta.label}</span></div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%;background:${meta.color}"></div></div>
        <span class="chart-count">${count}</span>
      </div>`;
  }).join('');
  const readingBooks = state.books.filter(b => getBookStatus(b) === 'ongoing');
  const readingRows = readingBooks.map(b => {
    const pct = getReadingPct(b);
    const totalPages = Number(b.totalPages) || 0;
    const currentPage = Math.min(Number(b.currentPage) || 0, totalPages || (Number(b.currentPage) || 0));
    const barColor = getReadingBarColor(pct);
    return `
      <div class="reading-row">
        <div class="cover cover-reading">${b.coverUrl ? `<img src="${esc(b.coverUrl)}" alt="" onerror="this.style.display='none'" />` : ICONS.book}</div>
        <div class="reading-info">
          <div class="reading-row-top">
            <span class="reading-title">${esc(b.title)}</span>
            <span class="reading-pct" style="color:${barColor}">${pct}%</span>
          </div>
          <p class="reading-author">${esc(b.author)}</p>
          <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <p class="reading-pages">${totalPages ? `${currentPage}/${totalPages} pages` : 'Total pages not set yet'}</p>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="home-view">
      <p class="welcome-row">Welcome! <span class="welcome-name" data-action="edit-name">${esc(state.userName)}</span></p>
      <div class="dashboard">
        <p class="section-title">Summary</p>
        <div class="chart">${rows}</div>
      </div>
      <div class="dashboard">
        <p class="section-title">Reading</p>
        ${readingBooks.length ? `<div class="reading-list">${readingRows}</div>` : `<p class="reading-empty">No books currently being read.</p>`}
      </div>
    </div>
    <button class="btn-add-fab-square" id="add-btn-home" aria-label="Add book">${ICONS.plus}</button>
  `;
}

function getReadingPct(book) {
  const total = Number(book.totalPages) || 0;
  const current = Number(book.currentPage) || 0;
  if (!total || total <= 0) return 0;
  return Math.max(0, Math.min(100, Math.round((current / total) * 100)));
}

function getReadingBarColor(pct) {
  if (pct < 100 / 3) return '#FF5555';
  if (pct <= 200 / 3) return '#FFC118';
  return '#82c8e5';
}

  preview.innerHTML = state.form.coverUrl ? `<img src="${esc(state.form.coverUrl)}" alt="" onerror="this.style.display='none'" />` : ICONS.book;
}

function resizeImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function rerenderPreserveFocus() {
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  render();
  if (id) {
    const el = document.getElementById(id);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state.books, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'book-tracker-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('invalid format');
      if (confirm(`Import ${data.length} books? This will replace your current data.`)) {
        state.books = data; saveBooks(); render();
      }
    } catch (err) { alert('Invalid file. Make sure this is a JSON backup file from this app.'); }
  };
  reader.readAsText(file);
}

function attachHandlers() {
  const app = document.getElementById('app');

  const tabHomeBtn = document.getElementById('tab-home-btn');
  const tabLibraryBtn = document.getElementById('tab-library-btn');
  if (tabHomeBtn) tabHomeBtn.addEventListener('click', () => { state.activeTab = 'home'; render(); });
  if (tabLibraryBtn) tabLibraryBtn.addEventListener('click', () => { state.activeTab = 'library'; render(); });

  const addBtnHome = document.getElementById('add-btn-home');
  if (addBtnHome) addBtnHome.addEventListener('click', openAddForm);
  const addBtnLib = document.getElementById('add-btn-lib');
  if (addBtnLib) addBtnLib.addEventListener('click', openAddForm);

  const settingsBtn = document.getElementById('settings-btn');
  if (settingsBtn) settingsBtn.addEventListener('click', () => { state.showSettings = true; render(); });
  const closeSettingsBtn = document.getElementById('close-settings');
  if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', () => { state.showSettings = false; render(); });

  const searchInput = document.getElementById('search-input');
  if (searchInput) searchInput.addEventListener('input', e => { state.query = e.target.value; rerenderPreserveFocus(); });
  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) sortSelect.addEventListener('change', e => { state.sortBy = e.target.value; render(); });

  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportData);
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');
  if (importBtn && importFile) {
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); });
  }

  app.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    const id = el.getAttribute('data-id');
    if (action === 'toggle') {
      el.addEventListener('click', () => { state.expandedId = id; state.confirmDeleteId = null; render(); });
    } else if (action === 'close-detail') {
      el.addEventListener('click', e => { e.stopPropagation(); state.expandedId = null; state.confirmDeleteId = null; render(); });
    } else if (action === 'edit') {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const book = state.books.find(b => b.id === id);
        if (book) { state.form = { ...emptyForm, ...book, status: book.status || getBookStatus(book) }; state.editingId = id; state.expandedId = null; state.showForm = true; render(); }
      });
    } else if (action === 'ask-delete') {
      el.addEventListener('click', e => { e.stopPropagation(); state.confirmDeleteId = id; render(); });
    } else if (action === 'cancel-delete') {
      el.addEventListener('click', e => { e.stopPropagation(); state.confirmDeleteId = null; render(); });
    } else if (action === 'delete') {
      el.addEventListener('click', e => { e.stopPropagation(); state.books = state.books.filter(b => b.id !== id); saveBooks(); state.confirmDeleteId = null; state.expandedId = null; render(); });
    } else if (action === 'view-list') {
      el.addEventListener('click', () => { state.libraryView = 'list'; render(); });
    } else if (action === 'view-grid') {
      el.addEventListener('click', () => { state.libraryView = 'grid'; render(); });
    } else if (action === 'edit-name') {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const newName = prompt('Your name:', state.userName === 'Reader' ? '' : state.userName);
        if (newName != null) {
          state.userName = newName.trim() || 'Reader';
          saveName();
          render();
        }
      });
    } else if (action === 'set-accent') {
      el.addEventListener('click', () => {
        const hex = el.getAttribute('data-hex');
        state.accentColor = hex;
        applyAccent(hex);
        STATUS_META.done.color = hex;
        saveAccentToStorage(hex);
        render();
      });
    }
  });

  const form = document.getElementById('book-form');
  if (form) {
    const bind = (elId, key) => { const el = document.getElementById(elId); if (el) el.addEventListener('input', e => { state.form[key] = e.target.value; }); };
    bind('f-title', 'title'); bind('f-author', 'author'); bind('f-translator', 'translator');
    bind('f-publisher', 'publisher'); bind('f-country', 'country'); bind('f-origin-year', 'originYear'); bind('f-isbn', 'isbn');
    bind('f-start', 'startDate'); bind('f-end', 'endDate'); bind('f-review', 'review');
    bind('f-current-page', 'currentPage'); bind('f-total-pages', 'totalPages');

    const statusSelect = document.getElementById('f-status');
    if (statusSelect) statusSelect.addEventListener('change', e => {
      state.form.status = e.target.value;
      rerenderPreserveFocus();
    });

    const coverUrlInput = document.getElementById('f-cover-url');
    if (coverUrlInput) coverUrlInput.addEventListener('input', e => { state.form.coverUrl = e.target.value; updateCoverPreview(); });

    const pickBtn = document.getElementById('pick-cover-btn');
    const coverFileInput = document.getElementById('f-cover-file');
    if (pickBtn && coverFileInput) {
      pickBtn.addEventListener('click', () => coverFileInput.click());
      coverFileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        resizeImageFile(file, 500, 0.78).then(dataUrl => {
          state.form.coverUrl = dataUrl;
          const urlInput = document.getElementById('f-cover-url');
          if (urlInput) urlInput.value = '';
          updateCoverPreview();
        }).catch(() => { alert('Failed to load image. Try another photo.'); });
      });
    }

    const ratingInput = document.getElementById('f-rating');
    if (ratingInput) ratingInput.addEventListener('input', e => {
      state.form.rating = Number(e.target.value);
      const label = document.getElementById('rating-label');
      if (label) label.textContent = `Rating — ${state.form.rating.toFixed(1)}/10`;
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!state.form.title.trim() || !state.form.author.trim()) return;
      if (state.editingId) {
        state.books = state.books.map(b => b.id === state.editingId ? { ...state.form, id: state.editingId, addedAt: b.addedAt } : b);
      } else {
        state.books = [{ ...state.form, id: uid(), addedAt: Date.now() }, ...state.books];
      }
      saveBooks();
      state.showForm = false; state.editingId = null; state.form = { ...emptyForm };
      render();
    });

    const closeHandler = () => { state.showForm = false; state.editingId = null; state.form = { ...emptyForm }; render(); };
    const closeBtn = document.getElementById('close-form');
    const cancelBtn = document.getElementById('cancel-form');
    if (closeBtn) closeBtn.addEventListener('click', closeHandler);
    if (cancelBtn) cancelBtn.addEventListener('click', closeHandler);
  }
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist();
}
</script>
</body>
</html>
