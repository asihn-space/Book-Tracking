<style>
  :root {
    --bg: #FAFAFA;

    --text-soft: #71717A;
    --text-faint: #A1A1AA;

    --accent-dark: #077367;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-script: 'Sacramento', cursive;

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
  .header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); padding: 10px 12px; }
  .title { font-family: var(--font-display); font-size: 22px; line-height: 1; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: baseline; }
  .header-name { font-family: var(--font-script); font-size: 30px; line-height: 1; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--accent); margin-left: 4px; display: inline-block; }
  .header-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .settings-btn { background: none; border: none; cursor: pointer; color: var(--text-soft); padding: 4px; flex-shrink: 0; }
  .swatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .swatch-btn { width: 100%; aspect-ratio: 1; border-radius: 9999px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; outline-offset: 3px; }
  .swatch-btn.active { outline: 3px solid var(--text); }
  .swatch-wrap { position: relative; }
  .swatch-edit-btn { position: absolute; bottom: -3px; right: -3px; width: 20px; height: 20px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-soft); cursor: pointer; padding: 0; }
  .preset-edit-preview { width: 100%; height: 56px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
  .preset-edit-error { font-size: 12.5px; color: #B91C1C; margin: -8px 0 12px; }
  .swatch-hint { font-size: 12.5px; color: var(--text-soft); margin: 14px 0 0; }

  /* Dashboard modal */
  .dashboard-title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 800; font-size: 17px; margin: 0; }
  .dash-cat-row { display: flex; gap: 0; background: var(--surface); border-radius: 14px; padding: 4px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .dash-cat-chip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 8px; border-radius: 10px; background: none; border: none; font-size: 13px; font-weight: 700; color: var(--text-soft); cursor: pointer; font-family: var(--font-display); white-space: nowrap; }
  .dash-cat-chip svg { width: 15px; height: 15px; flex-shrink: 0; }
  .dash-cat-chip.active { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 3px 10px rgba(var(--accent-rgb), 0.28); }
  .year-filter-row { display: flex; align-items: center; gap: 5px; overflow-x: auto; margin: -6px 0 16px; scrollbar-width: none; }
  .year-filter-row::-webkit-scrollbar { display: none; }
  .year-filter-chip { flex-shrink: 0; padding: 4px 11px; border-radius: 9999px; background: none; border: 1px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text-faint); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .year-filter-chip.active { background: rgba(var(--accent-rgb), 0.12); color: var(--accent); border-color: rgba(var(--accent-rgb), 0.4); }

  .picker-trigger { position: fixed; bottom: 88px; right: max(18px, calc(50% - 302px)); z-index: 24; display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; height: 32px; border-radius: 10px; background: var(--accent); border: none; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--accent-contrast); cursor: pointer; box-shadow: 0 6px 14px rgba(var(--accent-rgb), 0.28); }
  .picker-trigger svg { width: 12px; height: 12px; color: var(--accent-contrast); flex-shrink: 0; }
  .sheet-option-list { display: flex; flex-direction: column; gap: 4px; }
  .sheet-option-btn { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; border: none; background: none; text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--text); cursor: pointer; }
  .sheet-option-btn.active { background: rgba(var(--accent-rgb), 0.12); color: var(--accent); }
  .sheet-option-btn.active svg { color: var(--accent); }
  .sheet-title { font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0 0 12px; padding: 0 2px; }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .bar-rank-row { margin-bottom: 14px; }
  .bar-rank-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
  .bar-rank-name { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-rank-count { font-size: 12px; font-weight: 700; color: var(--text-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .bar-track { height: 10px; background: var(--bg); border-radius: 9999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 9999px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 9999px; background: var(--accent); color: var(--accent-contrast); font-family: var(--font-display); font-weight: 800; font-size: 11px; flex-shrink: 0; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-size: 13.5px; font-weight: 700; color: var(--text); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-sub { font-size: 11.5px; color: var(--text-soft); margin: 2px 0 0; }
  .rank-value { font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; white-space: nowrap; }
  .rank-value-rating { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 13px; color: #CA8A04; flex-shrink: 0; }
  .year-group { margin-bottom: 18px; padding: 14px; background: var(--surface); border: 1px solid transparent; border-radius: 14px; box-shadow: 0 3px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04); }
  .year-group:last-child { margin-bottom: 0; }
  .year-group-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px; margin-bottom: 4px; }
  .year-group-title { font-family: var(--font-display); font-weight: 800; font-size: 15px; margin: 0; }
  .year-group-stats { font-size: 11.5px; color: var(--text-soft); }
  .month-chart { display: flex; align-items: flex-end; gap: 4px; margin-top: 8px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .month-col-count { font-size: 10px; font-weight: 700; color: var(--text-soft); height: 13px; font-variant-numeric: tabular-nums; }
  .month-col-track { width: 100%; max-width: 18px; height: 84px; display: flex; align-items: flex-end; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .month-col-fill { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 0; }
  .month-col-label { font-size: 9.5px; color: var(--text-faint); margin-top: 4px; }
  .year-top5-heading { font-size: 11px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.02em; margin: 10px 0 2px; text-transform: uppercase; }
  .dash-empty { font-size: 13px; color: var(--text-soft); text-align: center; padding: 30px 0; }
  .stat-chip-row { display: flex; gap: 4px; padding: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 9999px; overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; }
  .stat-chip-row::-webkit-scrollbar { display: none; }
  .stat-chip { flex: 1 0 auto; padding: 9px 16px; border-radius: 9999px; background: none; border: none; font-size: 12.5px; font-weight: 700; color: var(--text-soft); cursor: pointer; font-family: var(--font-display); white-space: nowrap; }
  .stat-chip.active { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 3px 10px rgba(var(--accent-rgb), 0.28); }
  .pie-chart-svg { width: 100%; height: auto; display: block; margin: 4px auto 0; }

  main { padding: 16px 16px 40px; }
  .error-banner { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }

  /* Home / dashboard */
  .welcome-row { margin: 0 0 4px; font-size: 22px; color: var(--text); font-weight: 500; }
  .welcome-name { font-family: var(--font-script); font-size: 30px; font-weight: 400; color: var(--accent); cursor: pointer; margin-left: 3px; }
  .pages-read-row { margin: 0 0 16px; font-size: 13.5px; color: var(--text-soft); }
  .pages-read-row strong { color: var(--accent); font-weight: 800; }
  .header-actions { display: flex; gap: 2px; }
  .section-title { font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 14px; }
  .dashboard { padding: 18px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 22px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.06); }
  .dashboard-float { border-color: transparent; }
  .chart { display: flex; flex-direction: column; gap: 14px; }
  .chart-row { display: flex; align-items: center; gap: 10px; }
  .chart-label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--text-soft); width: 108px; flex-shrink: 0; }
  .chart-dot { width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; }
  .chart-bar-track { flex: 1; height: 8px; border-radius: 9999px; background: var(--bg); overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 9999px; }
  .chart-count { font-size: 13px; font-weight: 600; color: var(--text-soft); width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .home-view { padding-bottom: 90px; }
  .dashboard + .dashboard { margin-top: 14px; }
  .dash-summary-strip { display: grid; grid-template-columns: 3fr 3fr 5fr; gap: 8px; margin-bottom: 14px; }
  .dash-summary-tile { background: rgba(var(--accent-rgb), 0.16); border: 1px solid rgba(var(--accent-rgb), 0.22); border-radius: 14px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 10px 22px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.06); }
  .dash-summary-value { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--text); margin: 0; line-height: 1.25; }
  .dash-summary-value-text { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .dash-summary-label { font-size: 10px; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.02em; margin: 3px 0 0; line-height: 1.3; }

  /* Quotes */
  .quotes-view { padding-bottom: 90px; }
  .quotes-wall { column-count: 2; column-gap: 12px; }
  @media (max-width: 380px) { .quotes-wall { column-count: 1; } }
  .quote-card { position: relative; break-inside: avoid; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 14px 14px; margin: 0 0 16px; box-shadow: 0 3px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; user-select: none; -webkit-user-select: none; }
  .quote-card.select-mode { transform: none !important; }
  .quote-card.quote-selected { outline: 3px solid var(--accent); outline-offset: -1px; }
  .quote-select-check { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; z-index: 2; color: transparent; }
  .quote-select-check.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .quote-select-toolbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 40; box-shadow: 0 -4px 14px rgba(0,0,0,0.08); }
  .quote-select-count { font-size: 14px; font-weight: 600; color: var(--text); }
  .quote-card:active { transform: scale(0.97); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .quote-card-text { -webkit-line-clamp: 8; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .quote-expand-sheet { text-align: center; padding-top: 34px; }
  .quote-expand-mark { color: rgba(var(--accent-rgb), 0.22); display: flex; justify-content: center; margin-bottom: 4px; }
  .quote-expand-mark svg { width: 34px; height: 34px; }
  .quote-expand-text { font-family: 'Noto Serif', serif; font-size: 17px; font-weight: 400; line-height: 1.7; color: var(--text); margin: 8px 0 22px; text-align: left; }
  .quote-expand-book { display: block; font-family: 'Alex Brush', cursive; font-size: 26px; font-weight: 400; color: var(--accent); line-height: 1.2; }
  .quote-expand-author { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--text-faint); letter-spacing: 0.01em; margin-top: 2px; }
  .quote-card-mark { position: absolute; top: 8px; left: 10px; color: rgba(var(--accent-rgb), 0.22); }
  .quote-card-mark svg { width: 26px; height: 26px; }
  .quote-card-text { position: relative; font-family: 'Noto Serif', serif; font-size: 13px; font-weight: 400; line-height: 1.55; color: var(--text); margin: 6px 0 14px; }
  .quote-card-book { display: block; text-align: right; font-family: 'Alex Brush', cursive; font-size: 16px; font-weight: 400; color: var(--accent); line-height: 1; }
  .quote-card-author { display: block; text-align: right; font-family: var(--font-body); font-size: 10px; font-weight: 500; color: var(--text-faint); letter-spacing: 0.01em; margin-top: 0; }

  /* Shareable card selection (books + dashboard) */
  .card-select-host { position: relative; }
  .card-select-host.card-selected { outline: 3px solid var(--accent); outline-offset: -2px; border-radius: 14px; }
  .card-select-host.card-select-active { cursor: pointer; }

  /* Quote inputs (form) */
  .quote-input-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .quote-input-row textarea { flex: 1; }
  .quote-remove-btn { flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .reading-list { display: flex; flex-direction: column; gap: 16px; }
  .reading-row { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .cover-reading { width: 44px; flex-shrink: 0; }
  .reading-info { flex: 1; min-width: 0; }
  .reading-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .reading-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reading-pct { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .recent-rating { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: #CA8A04; flex-shrink: 0; }
  .recent-rating svg { width: 11px; height: 11px; }
  .reading-author { font-size: 11.5px; color: var(--text-soft); margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reading-pages { font-size: 11px; color: var(--text-faint); margin: 6px 0 0; }
  .reading-empty { font-size: 13px; color: var(--text-soft); text-align: center; padding: 10px 0 2px; }
  .btn-add-fab-square { position: fixed; bottom: 88px; right: max(18px, calc(50% - 302px)); width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-contrast); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 24px rgba(var(--accent-rgb), 0.32); z-index: 30; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--border); display: flex; max-width: 640px; margin: 0 auto; padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav-btn { flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 7px 4px 5px; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-faint); border-radius: 12px; }
  .bottom-nav-btn svg { display: block; flex-shrink: 0; width: 20px; height: 20px; }
  .bottom-nav-btn span { display: block; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom-nav-btn.active { color: var(--accent); }

  /* Dashboard tab (was modal) */
  .dashboard-view { padding-bottom: 90px; }

  /* Library toolbar */
  .lib-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .view-toggle { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .view-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: none; background: none; cursor: pointer; color: var(--text-faint); }
  .view-btn.active { background: var(--accent); color: var(--accent-contrast); }
  .icon-add-btn { width: 36px; height: 36px; border-radius: 9999px; background: var(--accent); color: var(--accent-contrast); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-box { flex: 1.3; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
  .search-box input { border: none; outline: none; background: transparent; width: 100%; padding: 10px 0; font-size: 14px; font-family: inherit; color: var(--text); }
  .custom-select-wrap { position: relative; flex: 1; min-width: 0; }
  .custom-select-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 12.5px; padding: 0 10px; height: 100%; border-radius: 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); font-family: inherit; cursor: pointer; }
  .custom-select-trigger svg { flex-shrink: 0; color: var(--text-faint); }
  .custom-select-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field .custom-select-wrap { width: 100%; }
  .field .custom-select-trigger { padding: 10px 12px; font-size: 14px; }
  .custom-select-menu { position: absolute; top: calc(100% + 6px); min-width: 168px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,0.14); overflow: hidden; z-index: 35; }
  .custom-select-menu-left { left: 0; }
  .custom-select-menu-right { right: 0; }
  .custom-select-option { display: block; width: 100%; text-align: left; padding: 10px 14px; font-size: 13.5px; font-family: inherit; background: none; border: none; color: var(--text); cursor: pointer; }
  .custom-select-option + .custom-select-option { border-top: 1px solid var(--border); }
  .custom-select-option.active { color: var(--accent); font-weight: 700; background: rgba(var(--accent-rgb), 0.08); }

  /* List view */
  .list-view { display: flex; flex-direction: column; gap: 6px; }
  .item { border-radius: 14px; padding: 10px; background: var(--surface); border: 1px solid transparent; box-shadow: 0 3px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04); }
  .item-row { display: flex; gap: 10px; cursor: pointer; position: relative; align-items: flex-start; }
  .cover { border-radius: 6px; overflow: hidden; aspect-ratio: 2/3; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text-faint); flex-shrink: 0; position: relative; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .cover-placeholder-letter { font-family: var(--font-display); font-weight: 800; color: rgba(24,24,27,0.38); position: relative; z-index: 1; line-height: 1; }
  .cover-placeholder-icon { position: absolute; width: 62%; height: 62%; color: rgba(255,255,255,0.4); z-index: 0; }
  .cover-img-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 2; }
  .cover-list .cover-placeholder-letter, .cover-reading .cover-placeholder-letter { font-size: 16px; }
  .cover-grid .cover-placeholder-letter { font-size: 24px; }
  .cover-detail .cover-placeholder-letter { font-size: 30px; }
  .cover-list { width: 48px; }
  .item-info { flex: 1; min-width: 0; padding-right: 46px; }
  .item-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; margin: 0; line-height: 1.32; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-author { font-size: 12.5px; color: var(--text-soft); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rate-plain { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; color: #CA8A04; position: absolute; top: 0; right: 0; }
  .rate-plain svg { flex-shrink: 0; }
  .item-publisher { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; margin: 5px 0 0; }
  .status-line { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .status-line .status-mini { margin-top: 0; }
  .item-date-range { font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 4px 0 0; }

  /* Grid view */
  .grid-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

function hexToRgbString(hex) {

function hexToHsl(hex) {

  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function cardKey(type, id) { return type + ':' + id; }
function isCardSelected(type, id) { return state.selectedCards.some(c => c.type === type && c.id === id); }

function getBookStatus(b) {
  if (b.status) return b.status;
  if (b.startDate && b.endDate) return 'done';
  if (b.startDate) return 'ongoing';
  return 'tbr';
}
function formatDate(d) { if (!d) return '-'; try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return d; } }
function todayStr() { const dt = new Date(); const y = dt.getFullYear(); const m = String(dt.getMonth() + 1).padStart(2, '0'); const day = String(dt.getDate()).padStart(2, '0'); return `${y}-${m}-${day}`; }
function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function getCoverInitial(title) {
  const t = (title || '').trim();
  return t ? t.charAt(0).toUpperCase() : '?';
}
function renderCoverPlaceholder(title, sizeClass) {
  const hash = hashStr(title || '?');
  const hue1 = hash % 360;
  const hue2 = (hue1 + 34) % 360;
  const style = `background: linear-gradient(150deg, hsl(${hue1} 62% 90%), hsl(${hue2} 58% 80%));`;
  return `<div class="cover-placeholder ${sizeClass || ''}" style="${style}"><span class="cover-placeholder-letter">${esc(getCoverInitial(title))}</span>${ICONS.bookOutline}</div>`;
}
function getLangBadge(lang) {
  if (!lang) return '';
  const key = lang.trim().toLowerCase();
  const map = {

}

function getPagesReadForBook(b) {
  const status = getBookStatus(b);
  const total = Number(b.totalPages) || 0;
  const current = Number(b.currentPage) || 0;
  if (status === 'done') return total;
  if (status === 'ongoing' || status === 'dnf') return total ? Math.min(current, total) : current;
  return 0;
}
function getTotalPagesRead(books) {
  return books.reduce((sum, b) => sum + getPagesReadForBook(b), 0);
}
function daysBetween(start, end) {
  try {
    const d1 = new Date(start + 'T00:00:00');
    const d2 = new Date(end + 'T00:00:00');
    const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    return Math.max(1, diff + 1);
  } catch (e) { return 1; }
}
function rankBy(books, keyFn) {
  const map = new Map();
  books.forEach(b => {
    const key = keyFn(b);
    if (!key) return;
    map.set(key, (map.get(key) || 0) + 1);
  });
  return [...map.entries()].sort((a, b) => b[1] - a[1]);
}
function getPagesPerDayRanking(books) {
  return books
    .filter(b => getBookStatus(b) === 'done' && b.startDate && b.endDate && Number(b.totalPages) > 0)
    .map(b => {
      const days = daysBetween(b.startDate, b.endDate);
      return { title: b.title, author: b.author, pages: Number(b.totalPages), days, rate: Number(b.totalPages) / days };
    })
    .sort((a, b) => b.rate - a.rate);
}
function getYearGrouping(books, yearFilter) {
  const map = new Map();
  books.forEach(b => {
    if (getBookStatus(b) !== 'done' || !b.endDate) return;
    const year = b.endDate.slice(0, 4);
    if (yearFilter && year !== yearFilter) return;
    if (!map.has(year)) map.set(year, { year, books: [], totalPages: 0 });
    const entry = map.get(year);
    entry.books.push(b);
    entry.totalPages += Number(b.totalPages) || 0;
  });
  return [...map.values()]
    .sort((a, b) => b.year.localeCompare(a.year))
    .map(e => ({
      year: e.year,
      count: e.books.length,
      totalPages: e.totalPages,
      perDay: e.totalPages / 365,
      top5: [...e.books].sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0)).slice(0, 5)
    }));
}

function renderCustomSelect(key, options, currentValue, align) {

  const label = current ? current.label : placeholder;
  const isOpen = state.openDropdown === key;
  return `

      <button type="button" class="custom-select-trigger" data-action="toggle-dropdown" data-dropdown="${key}" aria-haspopup="listbox" aria-expanded="${isOpen}">

        ${ICONS.chevronDown}
      </button>
      ${isOpen ? `
        <div class="custom-select-menu custom-select-menu-${align}" role="listbox">
          ${options.map(o => `
            <button type="button" class="custom-select-option ${o.value === currentValue ? 'active' : ''}" data-action="pick-option" data-dropdown="${key}" data-value="${o.value}">
              ${esc(o.label)}
            </button>`).join('')}
        </div>` : ''}
    </div>`;
}

function getFiltered() {
  const q = state.query.trim().toLowerCase();
  let list = state.books.filter(b => {
    if (state.statusFilter && state.statusFilter !== 'all' && getBookStatus(b) !== state.statusFilter) return false;
    if (!q) return true;
    return [b.title, b.author, b.publisher, b.country, b.translator, b.language].some(v => (v || '').toLowerCase().includes(q));
  });
  list = [...list].sort((a, b) => {
    if (state.sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
    if (state.sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
    if (state.sortBy === 'finished') {
      const order = { done: 0, ongoing: 1, tbr: 2, dnf: 3 };
      const diff = order[getBookStatus(a)] - order[getBookStatus(b)];
      if (diff !== 0) return diff;
      return (b.endDate || '').localeCompare(a.endDate || '');
    }
    return (b.addedAt || 0) - (a.addedAt || 0);
  });
  return list;
}

  return Math.max(0, Math.min(100, Math.round((current / total) * 100)));
}

// ---- Confetti: real canvas particle physics (gravity, drag, spin) instead of hand-tuned CSS keyframes ----
const CONFETTI_COLORS = [
  { base: '#FFC700', light: '#FFF3B0', dark: '#8A6200' }, // gold
  { base: '#FF5D73', light: '#FFC0C9', dark: '#8A1030' }, // red-pink
  { base: '#FF9F45', light: '#FFDCAE', dark: '#8A4A00' }, // orange
  { base: '#7C3AED', light: '#D6BBFB', dark: '#4C1D95' }, // purple
  { base: '#06AED4', light: '#9FE8F5', dark: '#0B6478' }, // cyan
  { base: '#10B77E', light: '#8CF0C7', dark: '#075E45' }, // green
  { base: '#FF7AC6', light: '#FFD3ED', dark: '#9C1E70' }, // pink
  { base: '#5B8DEF', light: '#BBD3FF', dark: '#1E3A8A' }  // blue
];

function confettiRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function confettiStarPath(ctx, r) {
  const inner = r * 0.42;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : inner;
    const ang = (Math.PI / 5) * i - Math.PI / 2;
    const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function launchConfetti(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (canvas._confettiStop) canvas._confettiStop();

  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 300;
  const cssH = canvas.clientHeight || canvas.parentElement.clientHeight || 400;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const gravity = cssH * 1.15;      // px/s^2 — scales with the modal so it always feels right
  const dragH = 0.9;                // horizontal air resistance per second
  const dragV = 0.12;               // slight vertical air resistance

  const particles = [];
  const sparkleList = [];
  const spawnQueue = [];            // { at (ms offset), spawn: fn }
  let launchTime = null;
  let rafId = null;

  function pushBurst(originX, originY, dirSign) {
    const angleDeg = 52 + Math.random() * 32;
    const angleRad = angleDeg * Math.PI / 180;
    const speed = cssH * (0.95 + Math.random() * 0.65);
    const spread = 0.55 + Math.random() * 0.55;
    const shapeRoll = Math.random();
    const shape = shapeRoll < 0.5 ? 'star' : 'rect';
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    particles.push({
      kind: 'burst', shape, color,
      x: originX, y: originY,
      vx: dirSign * Math.cos(angleRad) * speed * spread,
      vy: -Math.sin(angleRad) * speed,
      w: 6 + Math.random() * 4,
      h: 0,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() < 0.5 ? -1 : 1) * (Math.PI * (0.9 + Math.random() * 2.4)),
      flutterPhase: Math.random() * Math.PI * 2,
      flutterSpeed: 4.5 + Math.random() * 4,
      shinePhase: Math.random() * Math.PI * 2,
      spawn: 0, life: 2400 + Math.random() * 1500
    });
  }

  function pushSparkle(delayMs) {
    spawnQueue.push({
      at: delayMs,
      spawn: () => {
        const side = Math.random() < 0.5 ? 0 : 1;
        sparkleList.push({
          x: (side === 0 ? Math.random() * cssW * 0.35 : cssW * 0.65 + Math.random() * cssW * 0.35),
          y: cssH * (0.35 + Math.random() * 0.5),
          size: 2.5 + Math.random() * 3.5,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          spawn: performance.now(), life: 550 + Math.random() * 450
        });
      }
    });
  }

  // Two pops instead of one: a big immediate burst, then a second wave a beat later so it reads
  // as "burst — burst" rather than one continuous shot.
  function fireBurstWave(waveCount, delayMs) {
    for (let i = 0; i < waveCount; i++) {
      const leftX = cssW * (0.02 + Math.random() * 0.08), leftY = cssH * (0.62 + Math.random() * 0.1);
      const rightX = cssW * (0.9 + Math.random() * 0.08), rightY = cssH * (0.62 + Math.random() * 0.1);
      if (delayMs <= 0) {
        pushBurst(leftX, leftY, 1);
        pushBurst(rightX, rightY, -1);
      } else {
        spawnQueue.push({ at: delayMs + Math.random() * 120, spawn: () => pushBurst(leftX, leftY, 1) });
        spawnQueue.push({ at: delayMs + Math.random() * 120, spawn: () => pushBurst(rightX, rightY, -1) });
      }
    }
  }
  fireBurstWave(52, 0);
  fireBurstWave(44, 420);
  // Glints of light popping near the launch points, one flurry per burst
  for (let i = 0; i < 22; i++) pushSparkle(Math.random() * 900);
  for (let i = 0; i < 22; i++) pushSparkle(420 + Math.random() * 900);

  function drawParticle(p, now) {
    const age = now - p.spawn;
    const t = age / p.life;
    let opacity;
    if (t < 0.08) opacity = t / 0.08;
    else if (t > 0.82) opacity = Math.max(0, 1 - (t - 0.82) / 0.18);
    else opacity = 1;
    if (opacity <= 0) return;

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    const flap = Math.sin(now / 1000 * p.flutterSpeed + p.flutterPhase);

    if (p.shape === 'ribbon') {
      // Curl the strip into a soft "S" with a stroked curve instead of a straight scaled bar —
      // a rigid rectangle always reads as a stick no matter how it's squished.
      const curve1 = Math.sin(now / 1000 * p.flutterSpeed + p.flutterPhase) * p.w * 2.6;
      const curve2 = Math.sin(now / 1000 * p.flutterSpeed * 0.7 + p.flutterPhase + 1.7) * p.w * 2.0;
      const grad = ctx.createLinearGradient(0, -p.h / 2, 0, p.h / 2);
      grad.addColorStop(0, p.color.light); grad.addColorStop(0.4, p.color.base);
      grad.addColorStop(0.7, p.color.dark); grad.addColorStop(1, p.color.light);
      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(1.4, p.w * (0.45 + 0.55 * Math.abs(Math.cos(now / 1000 * p.flutterSpeed + p.flutterPhase))));
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -p.h / 2);
      ctx.bezierCurveTo(curve1, -p.h / 6, curve2, p.h / 6, 0, p.h / 2);
      ctx.stroke();
    } else if (p.shape === 'star') {
      const tw = 0.8 + 0.2 * Math.sin(now / 1000 * p.flutterSpeed * 1.4 + p.flutterPhase);
      ctx.scale(tw, tw);
      ctx.fillStyle = p.color.base;
      confettiStarPath(ctx, p.w);
      ctx.fill();
    } else { // rect chip, tumbling like real cut paper
      const h = p.w * 1.8;
      const sy = 0.3 + 0.7 * Math.abs(flap);
      ctx.scale(1, sy);
      ctx.fillStyle = p.color.base;
      confettiRoundRect(ctx, -p.w / 2, -h / 2, p.w, h, 1);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSparkle(sp, now) {
    const t = (now - sp.spawn) / sp.life;
    if (t < 0 || t > 1) return;
    let scale, opacity;
    if (t < 0.35) { scale = (t / 0.35) * 1.15; opacity = t / 0.35; }
    else if (t < 0.65) { scale = 1.15 - ((t - 0.35) / 0.3) * 0.3; opacity = 1; }
    else { scale = 0.85 - ((t - 0.65) / 0.35) * 0.55; opacity = Math.max(0, 1 - (t - 0.65) / 0.35); }
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.translate(sp.x, sp.y);
    ctx.scale(scale, scale);
    ctx.shadowColor = sp.color.light;
    ctx.shadowBlur = 6;
    ctx.fillStyle = sp.color.light;
    ctx.beginPath();
    ctx.arc(0, 0, sp.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    if (launchTime === null) launchTime = now;
    const elapsed = now - launchTime;
    const dt = Math.min(0.032, (frame._last ? (now - frame._last) : 16) / 1000);
    frame._last = now;

    for (let i = spawnQueue.length - 1; i >= 0; i--) {
      if (spawnQueue[i].at <= elapsed) { spawnQueue[i].spawn(); spawnQueue.splice(i, 1); }
    }

    ctx.clearRect(0, 0, cssW, cssH);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (!p.spawn) p.spawn = now; // burst particles are created before the first frame runs
      p.vy += gravity * dt;
      p.vx *= Math.max(0, 1 - dragH * dt);
      p.vy *= Math.max(0, 1 - dragV * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.rotSpeed * dt;
      if ((now - p.spawn) > p.life || p.y > cssH + 60) { particles.splice(i, 1); continue; }
      drawParticle(p, now);
    }

    for (let i = sparkleList.length - 1; i >= 0; i--) {
      const sp = sparkleList[i];
      if (now - sp.spawn > sp.life) { sparkleList.splice(i, 1); continue; }
      drawSparkle(sp, now);
    }

    if (particles.length > 0 || spawnQueue.length > 0 || sparkleList.length > 0) {
      rafId = requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, cssW, cssH);
      rafId = null;
    }
  }

  canvas._confettiStop = () => { if (rafId) cancelAnimationFrame(rafId); spawnQueue.length = 0; particles.length = 0; sparkleList.length = 0; ctx.clearRect(0, 0, cssW, cssH); };
  rafId = requestAnimationFrame(frame);
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function describeArc(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
}

function tintShade(hex, percent) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  const toHex = v => clamp(v).toString(16).padStart(2, '0');
  if (percent >= 0) {
    return `#${toHex(r + (255 - r) * percent)}${toHex(g + (255 - g) * percent)}${toHex(b + (255 - b) * percent)}`;
  }
  const f = 1 + percent;
  return `#${toHex(r * f)}${toHex(g * f)}${toHex(b * f)}`;
}
function getPieShades(n, baseHex) {
  const darkP = -0.34, lightP = 0.62;
  const arr = [];
  for (let i = 0; i < n; i++) {
    const t = n <= 1 ? 0 : i / (n - 1);
    arr.push(tintShade(baseHex, darkP + (lightP - darkP) * t));
  }
  return arr;
}

function renderPieChart(entries) {
  if (!entries.length) return `<p class="dash-empty">No data yet.</p>`;
  const top5 = entries.slice(0, 5);
  const rest = entries.slice(5);
  const restTotal = rest.reduce((s, [, c]) => s + c, 0);
  const slices = [...top5];
  if (restTotal > 0) slices.push(['Others', restTotal]);

  const total = slices.reduce((s, [, c]) => s + c, 0);
  const cx = 200, cy = 200, r = 105;
  let angle = 0;
  const arcs = [];
  const leftLabels = [];
  const rightLabels = [];
  const shades = getPieShades(slices.length, state.accentColor);

  slices.forEach(([name, count], i) => {
    const sliceAngle = (count / total) * 360;
    const startAngle = angle;
    const endAngle = angle + sliceAngle;
    const midAngle = (startAngle + endAngle) / 2;
    arcs.push(`<path d="${describeArc(cx, cy, r, startAngle, endAngle)}" fill="${shades[i]}" stroke="var(--surface)" stroke-width="1" />`);
    const pct = Math.round((count / total) * 100);
    const isLeft = midAngle > 180;
    const entry = { name, count, pct, midAngle };
    if (isLeft) leftLabels.push(entry); else rightLabels.push(entry);
    angle = endAngle;
  });

  function layout(list, side) {
    list.sort((a, b) => polarToCartesian(cx, cy, r, a.midAngle).y - polarToCartesian(cx, cy, r, b.midAngle).y);
    const n = list.length;
    const spacing = 300 / Math.max(n, 1);
    return list.map((l, idx) => {
      const labelY = 50 + spacing * (idx + 0.5);
      const edgePoint = polarToCartesian(cx, cy, r, l.midAngle);
      const labelX = side === 'left' ? 14 : 386;
      const bendX = side === 'left' ? 64 : 336;
      return { ...l, edgePoint, labelX, labelY, bendX };
    });
  }

  const leftLaidOut = layout(leftLabels, 'left');
  const rightLaidOut = layout(rightLabels, 'right');

  function labelSvg(l, side) {
    const anchor = side === 'left' ? 'start' : 'end';
    const lineY = l.labelY - 8;
    return `
      <polyline points="${l.edgePoint.x},${l.edgePoint.y} ${l.bendX},${lineY} ${l.labelX},${lineY}" fill="none" stroke="var(--text-faint)" stroke-width="1.5" />
      <text x="${l.labelX}" y="${l.labelY - 6}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="var(--text)" font-family="Outfit, sans-serif" stroke="var(--surface)" stroke-width="4" paint-order="stroke fill" stroke-linejoin="round">${esc(truncateLabel(l.name, 16))}</text>
      <text x="${l.labelX}" y="${l.labelY + 10}" text-anchor="${anchor}" font-size="11" fill="var(--text-soft)" font-family="Outfit, sans-serif" stroke="var(--surface)" stroke-width="4" paint-order="stroke fill" stroke-linejoin="round">${l.count} book${l.count === 1 ? '' : 's'} · ${l.pct}%</text>`;
  }

  const labelsSvg = [...leftLaidOut.map(l => labelSvg(l, 'left')), ...rightLaidOut.map(l => labelSvg(l, 'right'))].join('');

  return `<svg viewBox="0 0 400 400" class="pie-chart-svg">${arcs.join('')}${labelsSvg}</svg>`;
}

function shuffleQuotesLayout(count) {
  state.quotesLayout = Array.from({ length: count }, () => ({
    rot: (Math.random() * 8 - 4).toFixed(2),
    ty: Math.round(Math.random() * 20 - 10)
  }));
  const order = Array.from({ length: count }, (_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  state.quotesOrder = order;
}

function buildQuotesList() {
  const list = [];
  state.books.forEach(b => {
    (b.quotes || []).forEach(q => {
      if (q && q.trim()) list.push({ text: q.trim(), bookTitle: b.title, author: b.author });
    });
  });
  return list;
}

function getAllQuotes() {
  const base = buildQuotesList();
  if (state.quotesOrder && state.quotesOrder.length === base.length) {
    return state.quotesOrder.map(i => base[i]);
  }
  return base;
}

function renderQuotes() {
  const baseCount = buildQuotesList().length;
  if (!state.quotesLayout || state.quotesLayout.length !== baseCount) shuffleQuotesLayout(baseCount);
  const quotes = getAllQuotes();
  if (!quotes.length) {
    return `
      <div class="quotes-view">
        <div class="empty-state">
          ${ICONS.book}
          <p class="empty-title">No quotes yet</p>
          <p class="empty-sub">Add a favorite quote when you fill in a book's details.</p>
        </div>
      </div>`;
  }
  const selectMode = state.quoteSelectMode;
  const selected = state.selectedQuoteIndices || [];
  const cards = quotes.map((q, i) => {
    const layout = state.quotesLayout[i] || { rot: 0, ty: 0 };
    const isSelected = selected.includes(i);
    const rotStyle = selectMode ? '' : `transform:rotate(${layout.rot}deg) translateY(${layout.ty}px);`;
    return `
      <div class="quote-card${selectMode ? ' select-mode' : ''}${isSelected ? ' quote-selected' : ''}" style="${rotStyle}" data-action="expand-quote" data-id="${i}">
        ${selectMode ? `<span class="quote-select-check${isSelected ? ' checked' : ''}">${isSelected ? ICONS.check : ''}</span>` : ''}
        <span class="quote-card-mark">${ICONS.quote}</span>
        <p class="quote-card-text">${esc(q.text)}</p>
        <span class="quote-card-book">${esc(q.bookTitle)}</span>
        ${q.author && q.author.trim() ? `<span class="quote-card-author">${esc(q.author.trim())}</span>` : ''}
      </div>`;
  }).join('');
  const toolbar = selectMode ? `
    <div class="quote-select-toolbar">
      <span class="quote-select-count">${selected.length} of 5 selected</span>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-secondary-sm" data-action="cancel-quote-select">Cancel</button>
        <button type="button" class="btn-secondary-sm" data-action="share-quotes" ${selected.length === 0 ? 'disabled' : ''}>${ICONS.share} Share</button>
      </div>
    </div>` : '';
  return `<div class="quotes-view"><div class="quotes-wall">${cards}</div></div>${toolbar}${state.expandedQuoteIndex !== null ? renderQuoteExpandSheet(state.expandedQuoteIndex) : ''}`;
}

function renderQuoteExpandSheet(index) {

  return `

function renderCountRanking(entries) {
  if (!entries.length) return `<p class="dash-empty">No data yet.</p>`;
  const max = Math.max(...entries.map(([, count]) => count));
  return entries.map(([name, count]) => {
    const pct = Math.round((count / max) * 100);
    const opacity = (0.3 + 0.7 * (count / max)).toFixed(2);
    return `
      <div class="bar-rank-row">
        <div class="bar-rank-label">
          <span class="bar-rank-name">${esc(name)}</span>
          <span class="bar-rank-count">${count} book${count === 1 ? '' : 's'}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:rgba(var(--accent-rgb),${opacity});"></div></div>
      </div>`;
  }).join('');
}

function getAvailableYears() {
  const years = new Set();
  state.books.forEach(b => { if (getBookStatus(b) === 'done' && b.endDate) years.add(b.endDate.slice(0, 4)); });
  return [...years].sort((a, b) => b.localeCompare(a));
}

function getYearMonthlyBreakdown(books, yearFilter) {
  const map = new Map();
  books.forEach(b => {
    if (getBookStatus(b) !== 'done' || !b.endDate) return;
    const year = b.endDate.slice(0, 4);
    if (yearFilter && year !== yearFilter) return;
    const month = parseInt(b.endDate.slice(5, 7), 10) - 1;
    if (!map.has(year)) map.set(year, new Array(12).fill(0));
    if (month >= 0 && month < 12) map.get(year)[month]++;
  });
  return [...map.entries()]
    .sort((a, b) => b[0].localeCompare(a[0]))
    .map(([year, counts]) => ({ year, counts, total: counts.reduce((s, c) => s + c, 0) }));
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let lines = [];
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  if (lines.length > 3) lines = lines.slice(0, 3);
  const startY = y - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lineHeight));
}

function getWrappedLines(ctx, text, maxWidth) {
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  return lines;
}

function generateAchievementCanvas(book, days, callback) {
  document.fonts.ready.then(() => {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0CBAA6';
    const accentText = getContrastTextColor(accent);
    const cx = canvas.width / 2;

    const coverBox = { x: cx - 257, y: 420, w: 514, h: 762, r: 24 };

    function drawDynamicLayer() {
      ctx.textAlign = 'center';

      ctx.font = '110px "Alex Brush", cursive';
      ctx.fillStyle = accent;
      ctx.fillText('Congratulations!', cx, 285);

      ctx.font = '500 36px Outfit, sans-serif';
      ctx.fillStyle = '#3F3F46';
      ctx.fillText("You've finished reading", cx, 355);

      const titleY = coverBox.y + coverBox.h + 100;
      ctx.font = '800 48px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = accent;
      wrapCanvasText(ctx, book.title.toUpperCase(), cx, titleY, 900, 52);

      const authorY = titleY + 63;
      ctx.font = '500 32px Outfit, sans-serif';
      ctx.fillStyle = '#3F3F46';
      ctx.fillText(book.author, cx, authorY);

      const pillY = authorY + 88;
      if (days != null) {
        const pillText = `${days} Day${days === 1 ? '' : 's'} of Reading`;
        ctx.font = '600 32px Outfit, sans-serif';
        const pillWidth = Math.max(380, ctx.measureText(pillText).width + 80);
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.roundRect(cx - pillWidth / 2, pillY, pillWidth, 68, 34);
        ctx.fill();
        ctx.fillStyle = accentText;
        ctx.fillText(pillText, cx, pillY + 45);
      }

      const totalPages = Number(book.totalPages) || 0;
      let nextY = pillY + 130;
      if (totalPages > 0) {
        ctx.font = '500 28px Outfit, sans-serif';
        ctx.fillStyle = '#71717A';
        ctx.fillText(`${totalPages} pages`, cx, nextY);
        nextY += 46;
      }

      if (book.startDate && book.endDate) {
        ctx.font = '500 28px Outfit, sans-serif';
        ctx.fillStyle = '#71717A';
        ctx.fillText(`${formatDateShort(book.startDate)} - ${formatDateShort(book.endDate)}`, cx, nextY);
      }

      ctx.font = '500 22px Outfit, sans-serif';
      ctx.fillStyle = '#A1A1AA';
      ctx.fillText('via Book Tracking', cx, 1872);

      callback(canvas);
    }

    function drawCoverAndFinish() {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 18;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(coverBox.x, coverBox.y, coverBox.w, coverBox.h, coverBox.r);
      ctx.fill();
      ctx.restore();

      if (book.coverUrl) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(coverBox.x, coverBox.y, coverBox.w, coverBox.h, coverBox.r);
            ctx.clip();
            const ir = img.width / img.height, cr = coverBox.w / coverBox.h;
            let dw, dh, dx, dy;
            if (ir > cr) { dh = coverBox.h; dw = coverBox.h * ir; dx = coverBox.x - (dw - coverBox.w) / 2; dy = coverBox.y; }
            else { dw = coverBox.w; dh = coverBox.w / ir; dx = coverBox.x; dy = coverBox.y - (dh - coverBox.h) / 2; }
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.restore();
          } catch (err) { /* cross-origin cover can't be baked in; continue without it */ }
          drawDynamicLayer();
        };
        img.onerror = () => drawDynamicLayer();
        img.src = book.coverUrl;
      } else {
        drawDynamicLayer();
      }
    }

    const bg = new Image();
    bg.onload = () => {
      ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
      drawCoverAndFinish();
    };
    bg.onerror = () => {
      ctx.fillStyle = '#EAE7E4';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawCoverAndFinish();
    };
    bg.src = ACHIEVEMENT_BG;
  });
}

function saveAchievementImage() {
  const book = state.achievementBook;
  if (!book) return;
  const days = (book.startDate && book.endDate) ? daysBetween(book.startDate, book.endDate) : null;
  generateAchievementCanvas(book, days, canvas => {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const safeName = (book.title || 'book').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      a.href = url; a.download = `${safeName}-finished.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  });
}

function shareAchievementImage() {
  const book = state.achievementBook;
  if (!book) return;
  const days = (book.startDate && book.endDate) ? daysBetween(book.startDate, book.endDate) : null;
  generateAchievementCanvas(book, days, canvas => {
    canvas.toBlob(async blob => {
      const file = new File([blob], 'book-achievement.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Finished reading!', text: `I just finished reading "${book.title}"!` });
        } catch (err) { /* user cancelled, nothing to do */ }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'book-achievement.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert("Sharing isn't supported here, so the image was downloaded instead — you can share it from your Gallery app.");
      }
    }, 'image/png');
  });
}


function generateQuoteCollageCanvas(quotes, callback) {
  document.fonts.ready.then(() => {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0CBAA6';
    const cx = canvas.width / 2;
    const textWidth = 860;
    const areaTop = 340;
    const areaBottom = 1820;

    // Base sizing — book title now reads as the largest, most confident line
    // (it's the "heading" of each block), the quote is the body copy, and the
    // author is a small tracked caption. This mirrors the hierarchy already
    // used on the in-app quote cards instead of fighting it.
    const base = { quoteFont: 29, quoteLineHeight: 43, bookFont: 40, authorFont: 19, afterQuoteGap: 22, afterBookGap: 12, afterAuthorGap: 34, dividerGap: 58 };

    // Draws text with manual letter-spacing (canvas' built-in letterSpacing
    // support is inconsistent across browsers), centered on cx.
    function drawTracked(text, x, y, spacing) {
      const chars = text.split('');
      const widths = chars.map(c => ctx.measureText(c).width);
      const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
      let cursorX = x - total / 2;
      const prevAlign = ctx.textAlign;
      ctx.textAlign = 'left';
      chars.forEach((c, i) => {
        ctx.fillText(c, cursorX, y);
        cursorX += widths[i] + spacing;
      });
      ctx.textAlign = prevAlign;
    }

    // A short line–diamond–line flourish, reused under the title and between quotes.
    function drawOrnament(y, opts = {}) {
      const { armLength = 90, gap = 14, size = 5, color = accent, alpha = 1 } = opts;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - gap - armLength, y);
      ctx.lineTo(cx - gap, y);
      ctx.moveTo(cx + gap, y);
      ctx.lineTo(cx + gap + armLength, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, y - size);
      ctx.lineTo(cx + size, y);
      ctx.lineTo(cx, y + size);
      ctx.lineTo(cx - size, y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function measureAt(scale) {
      const s = k => Math.round(base[k] * scale);
      ctx.font = `${s('quoteFont')}px "Noto Serif", serif`;
      let total = 0;
      const blocks = quotes.map((q, i) => {
        const lines = getWrappedLines(ctx, `"${q.text}"`, textWidth);
        const quoteH = lines.length * s('quoteLineHeight');
        const hasAuthor = !!(q.author && q.author.trim());
        const blockH = quoteH + s('afterQuoteGap') + s('bookFont') + (hasAuthor ? s('authorFont') + 10 : 0) + s('afterAuthorGap');
        total += blockH + (i < quotes.length - 1 ? s('dividerGap') : 0);
        return { lines, hasAuthor, blockH, quoteLineHeight: s('quoteLineHeight') };
      });
      return { total, blocks, s };
    }

    function drawCollage() {
      ctx.textAlign = 'center';

      // Small tracked kicker above the script title
      ctx.font = '600 19px Outfit, sans-serif';
      ctx.fillStyle = accent;
      drawTracked('A COLLECTION OF LINES I LOVE', cx, 150, 5);

      ctx.font = '84px "Alex Brush", cursive';
      ctx.fillStyle = accent;
      ctx.fillText('My Favorite Quotes', cx, 236);

      drawOrnament(276, { armLength: 70, gap: 12, size: 4 });

      let { total } = measureAt(1);
      const available = areaBottom - areaTop;
      const scale = total > available ? Math.max(available / total, 0.55) : 1;
      const { blocks, s } = measureAt(scale);
      const recalculated = measureAt(scale).total;
      const leftover = Math.max(available - recalculated, 0);
      const extraGap = leftover / (blocks.length + 1);

      let y = areaTop + extraGap;
      blocks.forEach((block, i) => {
        ctx.font = `${s('quoteFont')}px "Noto Serif", serif`;
        ctx.fillStyle = '#2c2c2a';
        block.lines.forEach((line, li) => {
          ctx.fillText(line, cx, y + block.quoteLineHeight * (li + 1) - block.quoteLineHeight * 0.3);
        });
        y += block.lines.length * block.quoteLineHeight + s('afterQuoteGap');

        ctx.font = `${s('bookFont')}px "Alex Brush", cursive`;
        ctx.fillStyle = accent;
        ctx.fillText(quotes[i].bookTitle, cx, y + s('bookFont') * 0.72);
        y += s('bookFont');

        if (block.hasAuthor) {
          y += 10;
          ctx.font = `600 ${s('authorFont')}px Outfit, sans-serif`;
          ctx.fillStyle = '#8A8580';
          drawTracked(quotes[i].author.trim().toUpperCase(), cx, y + s('authorFont') * 0.78, 2);
          y += s('authorFont');
        }
        y += s('afterAuthorGap');

        if (i < blocks.length - 1) {
          drawOrnament(y - s('afterAuthorGap') / 2, { armLength: 60, gap: 10, size: 3.5, color: '#B8B2AA', alpha: 0.9 });
          y += s('dividerGap') + extraGap;
        }
      });

      ctx.font = '500 22px Outfit, sans-serif';
      ctx.fillStyle = '#A1A1AA';
      ctx.fillText('via Book Tracking', cx, 1872);

      callback(canvas);
    }

    const bg = new Image();
    bg.onload = () => { ctx.drawImage(bg, 0, 0, canvas.width, canvas.height); drawCollage(); };
    bg.onerror = () => { ctx.fillStyle = '#EAE7E4'; ctx.fillRect(0, 0, canvas.width, canvas.height); drawCollage(); };
    bg.src = ACHIEVEMENT_BG;
  });
}

function drawTrackedText(ctx, text, x, y, spacing) {
  const chars = text.split('');
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cursorX = x - total / 2;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach((c, i) => { ctx.fillText(c, cursorX, y); cursorX += widths[i] + spacing; });
  ctx.textAlign = prevAlign;
}

function generateBookCardCanvas(book, callback) {
  document.fonts.ready.then(() => {
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1350;
    const ctx = canvas.getContext('2d');
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0CBAA6';
    const cx = canvas.width / 2;
    const status = getBookStatus(book);
    const coverBox = { x: cx - 220, y: 110, w: 440, h: 652, r: 20 };

    function drawText() {
      ctx.textAlign = 'center';
      const kicker = status === 'done' ? 'FINISHED READING' : status === 'ongoing' ? 'CURRENTLY READING' : status === 'dnf' ? 'DID NOT FINISH' : 'TO BE READ';
      ctx.font = '600 24px Outfit, sans-serif';
      ctx.fillStyle = accent;
      drawTrackedText(ctx, kicker, cx, 830, 4);

      const titleY = 895;
      ctx.font = '800 46px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#2c2c2a';
      wrapCanvasText(ctx, book.title.toUpperCase(), cx, titleY, 900, 54);

      ctx.font = '500 30px Outfit, sans-serif';
      ctx.fillStyle = '#71717A';
      ctx.fillText(book.author || '', cx, titleY + 80);

      let nextY = titleY + 145;
      if (status === 'ongoing') {
        const pct = getReadingPct(book);
        const barW = 700, barH = 20;
        const barX = cx - barW / 2;
        ctx.fillStyle = '#EAE7E4';
        ctx.beginPath(); ctx.roundRect(barX, nextY, barW, barH, 10); ctx.fill();
        ctx.fillStyle = accent;
        ctx.beginPath(); ctx.roundRect(barX, nextY, barW * Math.max(0, Math.min(100, pct)) / 100, barH, 10); ctx.fill();
        nextY += 54;
        ctx.font = '600 30px Outfit, sans-serif';
        ctx.fillStyle = accent;
        ctx.fillText(`${pct}% complete`, cx, nextY);
      } else if (status === 'done') {
        ctx.font = '600 32px Outfit, sans-serif';
        ctx.fillStyle = accent;
        ctx.fillText(`\u2605 ${Number(book.rating).toFixed(1)}`, cx, nextY);
        nextY += 50;
        if (book.startDate && book.endDate) {
          ctx.font = '500 26px Outfit, sans-serif';
          ctx.fillStyle = '#71717A';
          ctx.fillText(`${formatDateShort(book.startDate)} - ${formatDateShort(book.endDate)}`, cx, nextY);
        }
      } else {
        ctx.font = '600 32px Outfit, sans-serif';
        ctx.fillStyle = accent;
        ctx.fillText(`\u2605 ${Number(book.rating).toFixed(1)}`, cx, nextY);
      }

      ctx.font = '500 22px Outfit, sans-serif';
      ctx.fillStyle = '#A1A1AA';
      ctx.fillText('via Book Tracking', cx, 1300);

      callback(canvas);
    }

    function drawCoverAndFinish() {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.shadowBlur = 36;
      ctx.shadowOffsetY = 16;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(coverBox.x, coverBox.y, coverBox.w, coverBox.h, coverBox.r);
      ctx.fill();
      ctx.restore();

      if (book.coverUrl) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(coverBox.x, coverBox.y, coverBox.w, coverBox.h, coverBox.r);
            ctx.clip();
            const ir = img.width / img.height, cr = coverBox.w / coverBox.h;
            let dw, dh, dx, dy;
            if (ir > cr) { dh = coverBox.h; dw = coverBox.h * ir; dx = coverBox.x - (dw - coverBox.w) / 2; dy = coverBox.y; }
            else { dw = coverBox.w; dh = coverBox.w / ir; dx = coverBox.x; dy = coverBox.y - (dh - coverBox.h) / 2; }
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.restore();
          } catch (err) { /* cross-origin cover can't be baked in; continue without it */ }
          drawText();
        };
        img.onerror = () => drawText();
        img.src = book.coverUrl;
      } else {
        drawText();
      }
    }

    const bg = new Image();
    bg.onload = () => { ctx.drawImage(bg, 0, 0, canvas.width, canvas.height); drawCoverAndFinish(); };
    bg.onerror = () => { ctx.fillStyle = '#EAE7E4'; ctx.fillRect(0, 0, canvas.width, canvas.height); drawCoverAndFinish(); };
    bg.src = ACHIEVEMENT_BG;
  });
}

function generateCardCanvas(descriptor, callback) {
  if (descriptor.type === 'book') {
    const book = state.books.find(b => b.id === descriptor.id);
    if (!book) { callback(null); return; }
    generateBookCardCanvas(book, callback);
  } else if (descriptor.type === 'achievement') {
    generateAchievementCardCanvas(descriptor.id, callback);
  } else if (descriptor.type === 'stat') {
    generateStatCardCanvas(descriptor.id, callback);
  } else {
    callback(null);
  }
}

function shareSelectedCards() {
  const cards = state.selectedCards.slice();
  if (!cards.length) return;
  let remaining = cards.length;
  const canvases = new Array(cards.length);
  cards.forEach((descriptor, i) => {
    generateCardCanvas(descriptor, canvas => {
      canvases[i] = canvas;
      remaining--;
      if (remaining === 0) finishShareCards(canvases);
    });
  });
}

function finishShareCards(canvases) {
  const validCanvases = canvases.filter(Boolean);
  if (!validCanvases.length) { state.cardSelectMode = false; state.selectedCards = []; render(); return; }
  let pending = validCanvases.length;
  const files = new Array(validCanvases.length);
  validCanvases.forEach((canvas, i) => {
    canvas.toBlob(blob => {
      files[i] = new File([blob], `book-tracking-card-${i + 1}.png`, { type: 'image/png' });
      pending--;
      if (pending === 0) doShareCardFiles(files.filter(Boolean));
    }, 'image/png');
  });
}

function resizeImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function rerenderPreserveFocus() {
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  render();
  if (id) {
    const el = document.getElementById(id);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function csvEscape(val) {
  if (val == null) return '';
  const s = String(val);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCSV() {
  const headers = ['Title', 'Author', 'Translator', 'Publisher', 'Origin Country', 'Origin Year', 'Language', 'ISBN', 'Rating', 'Status', 'Start Date', 'End Date', 'Current Page', 'Total Pages', 'Review'];
  const rows = state.books.map(b => [
    b.title, b.author, b.translator, b.publisher, b.country, b.originYear, b.language, b.isbn,
    b.rating, STATUS_META[getBookStatus(b)].label,
    b.startDate, b.endDate, b.currentPage, b.totalPages, b.review
  ].map(csvEscape).join(','));
  const csv = [headers.map(csvEscape).join(','), ...rows].join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'book-tracker-export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('invalid format');
      if (confirm(`Import ${data.length} books? This will replace your current data.`)) {
        state.books = data; saveBooks(); render();
      }
    } catch (err) { alert('Invalid file. Make sure this is a JSON backup file from this app.'); }
  };
  reader.readAsText(file);
}
